<style>
/* 村の予約管理：パッと見てわかる・押しやすい・読みやすい */
#village-admin{--ink:#13302d;--ink2:#3d524e;--line:#cfdcd6;--bg:#f2f6f4;--card:#fff;--teal:#0d4f55;--teal-d:#083f44;--side:#0b373b;
  --wait:#b4441a;--wait-bg:#fff1e8;--wait-line:#f2b998;--ok:#1b6a3f;--ok-bg:#e5f4ea;--ok-line:#9fd1b1;--done:#4b5a57;--done-bg:#eceff0;--done-line:#c3cbca;--info:#245d86;--info-bg:#e5eef7;
  font-family:"Noto Sans JP",system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;font-size:1rem;line-height:1.7;-webkit-font-smoothing:antialiased}
#village-admin[hidden]{display:none}
#village-admin *{box-sizing:border-box}
:where(#village-admin) :where(button,input,select,textarea){font:inherit;color:inherit}
#village-admin .va-ic{width:1.25em;height:1.25em;flex:none}
#village-admin .va-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#village-admin :focus-visible{outline:3px solid #f0a33a;outline-offset:2px}

/* わく */
.va-shell{display:grid;grid-template-columns:15.5rem 1fr;min-height:100vh}
.va-side{background:var(--side);color:#fff;padding:1.4rem 1rem;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:1.4rem}
.va-brand{display:flex;gap:.7rem;align-items:center;padding:0 .4rem}
.va-brand .va-ic{width:2rem;height:2rem;color:#a9d3bd}
.va-brand small{display:block;font-size:.8rem;color:#a9d3bd;font-weight:700;letter-spacing:.08em}
.va-brand strong{font-size:1.1rem}
.va-nav{display:flex;flex-direction:column;gap:.35rem}
.va-nav-btn{position:relative;display:flex;align-items:center;gap:.8rem;min-height:3.4rem;padding:.6rem 1rem;border:0;border-radius:.9rem;background:transparent;color:#e6f0ec;font-size:1.08rem;font-weight:700;text-align:left;cursor:pointer}
.va-nav-btn:hover{background:rgba(255,255,255,.1)}
.va-nav-btn.on{background:#fff;color:var(--side)}
.va-owner{margin-top:auto;background:rgba(255,255,255,.08);border-radius:.9rem;padding:.8rem 1rem}
.va-owner small{display:block;color:#a9d3bd;font-size:.8rem}
.va-badge{display:inline-grid;place-items:center;min-width:1.6rem;height:1.6rem;padding:0 .4rem;border-radius:999px;background:var(--wait);color:#fff;font-size:.85rem;font-weight:700;margin-left:auto;line-height:1}
.va-main{min-width:0;display:flex;flex-direction:column}
.va-head{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.9rem 2rem;background:#fff;border-bottom:1px solid var(--line)}
.va-date{white-space:nowrap;display:flex;align-items:center;gap:.4rem;margin:0;font-weight:700;color:var(--ok);font-size:.95rem}
.va-head h1{margin:0;font-size:1.6rem;line-height:1.3}
.va-head-r{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;justify-content:flex-end}
.va-content{padding:1.6rem 2rem 4rem;max-width:62rem;width:100%}
.va-tabbar{display:none}

/* 文字の大きさ */
.va-fs{display:flex;align-items:center;gap:.25rem;padding:.25rem;border:1px solid var(--line);border-radius:999px;background:#f7faf8}
.va-fs-l{padding:0 .5rem;font-size:.85rem;font-weight:700;color:var(--ink2)}
.va-fs button{min-width:2.8rem;min-height:2.8rem;border:0;border-radius:999px;background:transparent;font-weight:700;cursor:pointer}
.va-fs button[data-v=small]{font-size:.85rem}.va-fs button[data-v=medium]{font-size:1rem}.va-fs button[data-v=large]{font-size:1.2rem}
.va-fs button.on{background:var(--teal);color:#fff}
.va-fs-wide{width:max-content}

/* ボタン */
.va-btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:3rem;padding:.55rem 1.2rem;border:2px solid var(--line);border-radius:.8rem;background:#fff;color:var(--ink);font-weight:700;font-size:1rem;cursor:pointer;text-decoration:none;line-height:1.3}
.va-btn:hover{border-color:var(--teal)}
.va-btn:disabled{opacity:.45;cursor:not-allowed}
.va-btn-primary{background:var(--teal);border-color:var(--teal);color:#fff}
.va-btn-primary:hover{background:var(--teal-d)}
.va-btn-danger{background:var(--wait);border-color:var(--wait);color:#fff}
.va-btn-ghost{border-color:transparent;background:transparent;color:var(--teal)}
.va-btn-ghost:hover{background:#e7efec;border-color:transparent}
.va-btn-lg{min-height:3.5rem;padding:.7rem 1.5rem;font-size:1.1rem}
.va-icon-btn{position:relative;display:inline-flex;align-items:center;gap:.4rem;min-height:3rem;padding:.4rem .9rem;border:2px solid var(--line);border-radius:999px;background:#fff;font-weight:700;font-size:.95rem;cursor:pointer;color:var(--ink);text-decoration:none}
.va-icon-btn .va-badge{position:absolute;top:-.45rem;right:-.45rem;margin:0}

/* 見出し */
.va-intro{margin-bottom:1rem}
.va-h2{display:flex;align-items:center;gap:.6rem;margin:0;font-size:1.4rem;line-height:1.4}
.va-h2-sub{font-size:1rem;color:var(--ink2);font-weight:700}
.va-h3{margin:1.4rem 0 .6rem;font-size:1.15rem}
.va-h4{margin:1.4rem 0 .5rem;font-size:1.05rem}
.va-lead{margin:.2rem 0 0;color:var(--ink2);font-size:1.02rem}
.va-p{margin:0 0 .7rem}
.va-count{display:inline-grid;place-items:center;min-width:2rem;height:2rem;border-radius:999px;background:var(--teal);color:#fff;font-size:1rem}
.va-mt{margin-top:2.2rem}
.va-hint{margin:.7rem 0 0;color:var(--ink2);font-size:.95rem}
.va-empty{margin:0;padding:1.4rem;text-align:center;color:var(--ink2);background:#fff;border:2px dashed var(--line);border-radius:1rem}
.va-empty-box{display:flex;flex-direction:column;align-items:center;gap:.4rem}
.va-empty-box .va-ic{width:2.4rem;height:2.4rem;color:var(--teal)}
.va-center{justify-content:center}

/* 3つの状態 */
.va-chip{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .7rem;border-radius:999px;font-size:.92rem;font-weight:700;border:1.5px solid;white-space:nowrap}
.va-chip .va-ic{width:1em;height:1em}
.st-wait{color:var(--wait);background:var(--wait-bg);border-color:var(--wait-line)}
.st-ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-line)}
.st-done{color:var(--done);background:var(--done-bg);border-color:var(--done-line)}
.st-wait-bg{background:var(--wait-bg);color:var(--wait)}.st-ok-bg{background:var(--ok-bg);color:var(--ok)}.st-info-bg{background:var(--info-bg);color:var(--info)}
.va-tag{display:inline-block;padding:.15rem .6rem;border-radius:.4rem;background:#fff;border:1.5px solid var(--done-line);font-size:.88rem;font-weight:700;color:var(--ink2)}
.va-legend{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin:.6rem 0 1rem;font-size:.95rem;color:var(--ink2);font-weight:700}

/* 今日やること */
.va-todo{display:flex;gap:1rem;padding:1.3rem;margin-bottom:1rem;background:#fff;border:2px solid var(--line);border-radius:1.2rem}
.va-todo-alert{border-color:#e9a56f;background:#fffaf5}
.va-todo-ic{flex:none;display:grid;place-items:center;width:3.2rem;height:3.2rem;border-radius:1rem;background:#fde3d0;color:var(--wait)}
.va-todo-ic .va-ic{width:1.7rem;height:1.7rem}
.va-todo-body{flex:1;min-width:0}
.va-todo-kicker{margin:0;color:var(--wait);font-weight:700}
.va-todo h3{margin:.1rem 0 .2rem;font-size:1.2rem;line-height:1.5}
.va-num{color:var(--wait);font-size:1.3em}
.va-todo-sub{margin:0 0 .8rem;color:var(--ink2)}
.va-todo-actions{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:.8rem}
.va-alldone{text-align:center;padding:2.2rem 1.4rem;background:var(--ok-bg);border:2px solid var(--ok-line);border-radius:1.2rem;margin-bottom:1rem}
.va-alldone>.va-ic{width:3rem;height:3rem;color:var(--ok)}
.va-alldone h3{margin:.4rem 0;font-size:1.3rem}
.va-alldone p{margin:0;color:var(--ink2)}

/* 予約カード */
.va-stack{display:flex;flex-direction:column;gap:.8rem}
.va-bk{background:#fff;border:2px solid var(--line);border-left-width:.5rem;border-radius:1rem;overflow:hidden}
.st-wait-edge{border-left-color:var(--wait)}.st-ok-edge{border-left-color:var(--ok)}.st-done-edge{border-left-color:#9aa6a4}
.va-bk-main{display:flex;align-items:center;gap:1rem;width:100%;padding:1rem 1.1rem;border:0;background:transparent;text-align:left;cursor:pointer}
.va-bk-main:hover{background:#f7faf8}
.va-bk-time{flex:none;min-width:4.6rem;text-align:center}
.va-bk-time strong{display:block;font-size:1.35rem;line-height:1.2}
.va-bk-date{display:block;font-size:.85rem;color:var(--ink2);font-weight:700}
.va-bk-body{flex:1;min-width:0}
.va-bk-top{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.2rem}
.va-bk-name{margin:0;font-size:1.15rem;font-weight:700}
.va-bk-name span{font-size:.95rem;color:var(--ink2)}
.va-bk-meta{margin:0;color:var(--ink2);font-size:.95rem}
.va-bk-more{flex:none;display:flex;align-items:center;gap:.1rem;color:var(--teal);font-weight:700;font-size:.92rem}
.va-bk-actions{display:flex;flex-wrap:wrap;gap:.6rem;padding:0 1.1rem 1rem 6.7rem}

/* 一覧・検索 */
.va-search{display:flex;align-items:center;gap:.6rem;padding:0 1rem;min-height:3.4rem;background:#fff;border:2px solid var(--line);border-radius:.9rem;margin-bottom:.9rem}
.va-search:focus-within{border-color:var(--teal)}
.va-search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:1.05rem;min-height:3rem}
.va-segs{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem}
.va-seg{display:inline-flex;align-items:center;gap:.4rem;min-height:3rem;padding:.4rem 1rem;border:2px solid var(--line);border-radius:999px;background:#fff;font-weight:700;cursor:pointer}
.va-seg span{display:inline-grid;place-items:center;min-width:1.6rem;height:1.6rem;border-radius:999px;background:var(--bg);font-size:.85rem}
.va-seg.on{background:var(--teal);border-color:var(--teal);color:#fff}
.va-seg.on span{background:rgba(255,255,255,.2)}

/* 電話 */
.va-bigchoice{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.va-choice{display:flex;flex-direction:column;align-items:flex-start;gap:.5rem;padding:1.6rem;min-height:11rem;border:2px solid var(--line);border-radius:1.2rem;background:#fff;text-align:left;cursor:pointer}
.va-choice:hover{border-color:var(--teal);background:#f7fbf9}
.va-choice .va-ic{width:2.4rem;height:2.4rem;padding:.45rem;border-radius:.8rem;background:var(--teal);color:#fff}
.va-choice strong{font-size:1.3rem}
.va-choice span{color:var(--ink2)}
.va-steps{display:flex;gap:.4rem;margin:0 0 1rem;padding:0;list-style:none;flex-wrap:wrap}
.va-steps li{display:flex;align-items:center;gap:.4rem;padding:.3rem .8rem .3rem .3rem;border-radius:999px;background:#fff;border:2px solid var(--line);font-weight:700;color:var(--ink2);font-size:.95rem}
.va-steps li span{display:grid;place-items:center;width:1.8rem;height:1.8rem;border-radius:999px;background:var(--bg)}
.va-steps li.on{border-color:var(--teal);color:var(--teal)}
.va-steps li.on span{background:var(--teal);color:#fff}
.va-steps li.done span{background:var(--ok);color:#fff}
.va-steps li.done span .va-ic{width:1rem;height:1rem}
.va-wiz-sum{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:.9rem}
.va-wiz-sum span{padding:.35rem .8rem;border-radius:.6rem;background:var(--ok-bg);font-weight:700}
.va-wiz-sum small{margin-right:.4rem;color:var(--ok);font-size:.82rem}
.va-q{padding:1.5rem;background:#fff;border:2px solid var(--line);border-radius:1.2rem}
.va-q-n{margin:0;color:var(--teal);font-weight:700}
.va-q-t{margin:.1rem 0 1.1rem;font-size:1.45rem;line-height:1.45}
.va-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem}
.va-grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:.7rem}
.va-pick{min-height:4.2rem;padding:.7rem;border:2px solid var(--line);border-radius:1rem;background:#fff;font-size:1.2rem;font-weight:700;cursor:pointer}
.va-pick:hover{border-color:var(--teal)}
.va-pick.on{border-color:var(--teal);background:var(--teal);color:#fff}
.va-weeknav{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-bottom:.9rem;flex-wrap:wrap}
.va-weeknav strong{font-size:1.05rem}
.va-days{display:grid;grid-template-columns:repeat(7,1fr);gap:.5rem}
.va-day{display:flex;flex-direction:column;align-items:center;gap:.05rem;min-height:5.4rem;padding:.5rem .2rem;border:2px solid var(--line);border-radius:1rem;background:#fff;cursor:pointer}
.va-day:hover{border-color:var(--teal)}
.va-day-w{font-weight:700;font-size:.95rem}
.va-day-d{font-size:1.55rem;font-weight:700;line-height:1.2}
.va-day-f{font-size:.82rem;color:var(--ink2);font-weight:700}
.va-day.sun .va-day-w{color:#c0392b}.va-day.sat .va-day-w{color:#2463a8}
.va-day.on{border-color:var(--teal);background:var(--teal);color:#fff}
.va-day.on .va-day-w,.va-day.on .va-day-f{color:#fff}
.va-times{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:.7rem}
.va-time{display:flex;flex-direction:column;align-items:center;min-height:4.6rem;padding:.5rem;border:2px solid var(--ok-line);border-radius:1rem;background:var(--ok-bg);cursor:pointer}
.va-time strong{font-size:1.4rem;line-height:1.2}
.va-time span{font-size:.85rem;font-weight:700;color:var(--ok)}
.va-time.busy{border-color:var(--wait-line);background:var(--wait-bg)}
.va-time.busy span{color:var(--wait)}
.va-time.on{border-color:var(--teal);background:var(--teal);color:#fff}
.va-time.on span{color:#fff}
.va-wiz-nav{display:flex;justify-content:space-between;align-items:center;gap:.8rem;margin-top:1rem;flex-wrap:wrap}
.va-wiz-nav>div,.va-wiz-nav .va-hint{width:100%;text-align:right}
.va-form{display:flex;flex-direction:column;gap:1rem}
.va-field{display:flex;flex-direction:column;gap:.35rem}
.va-field>span{font-weight:700}
.va-field em{font-style:normal;font-size:.8rem;padding:.05rem .45rem;margin-left:.3rem;border-radius:.3rem;background:var(--wait-bg);color:var(--wait)}
.va-field input,.va-field select,.va-field textarea{min-height:3.2rem;padding:.6rem .9rem;border:2px solid var(--line);border-radius:.8rem;background:#fff;font-size:1.08rem}
.va-field input:focus,.va-field select:focus,.va-field textarea:focus{border-color:var(--teal);outline:0}
.va-stepper{display:flex;align-items:center;gap:.5rem}
.va-stepper input{width:6rem;text-align:center;font-size:1.3rem;font-weight:700;min-height:3.2rem;border:2px solid var(--line);border-radius:.8rem}
.va-stepper>span{font-weight:700}
.va-stepper .va-btn{width:3.2rem;padding:0}
.va-check{display:flex;align-items:center;gap:.6rem;min-height:3rem;font-weight:700}
.va-check input{width:1.4rem;height:1.4rem}
.va-readout{padding:1.2rem 1.3rem;margin-bottom:1rem;background:#fffaf0;border:2px solid #f0d49a;border-radius:1rem;font-size:1.2rem;line-height:1.9}
.va-readout b{color:var(--teal)}
.va-card{padding:1.2rem;background:#fff;border:2px solid var(--line);border-radius:1rem}
.va-row{display:grid;grid-template-columns:8.5rem 1fr;gap:.8rem;padding:.6rem 0;border-bottom:1px solid #e6ecea}
.va-row:last-child{border-bottom:0}
.va-row-k{color:var(--ink2);font-weight:700}
.va-row-v{font-weight:700;word-break:break-word}
.va-two{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;align-items:start}
.va-pickrow{display:flex;flex-direction:column;align-items:flex-start;gap:.15rem;width:100%;padding:.9rem 1rem;border:2px solid var(--line);border-radius:1rem;background:#fff;text-align:left;cursor:pointer}
.va-pickrow>div{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}
.va-pickrow strong{font-size:1.1rem}
.va-pickrow>span{color:var(--ink2);font-size:.95rem}
.va-pickrow.on{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal) inset}
.va-modal .va-pickrow{margin-bottom:.6rem}
.va-log{padding:.8rem 1rem;margin-bottom:.6rem;background:#fff;border:2px solid var(--line);border-radius:.9rem}
.va-log p{margin:0;font-weight:700}
.va-log span{font-size:.88rem;color:var(--ink2)}
.va-back{margin:0 0 .4rem -.6rem}

/* カレンダー */
.va-calday{font-size:1.2rem;display:flex;align-items:center;gap:.5rem}
.va-today-badge{font-size:.85rem;padding:.1rem .6rem;border-radius:999px;background:var(--teal);color:#fff}
.va-days-cal{margin-bottom:1rem}
.va-row-actions{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:1rem}
.va-datepick{position:relative;overflow:hidden}
.va-datepick input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* その他 */
.va-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem}
.va-kpi{display:flex;flex-direction:column;padding:1.1rem 1.2rem;background:#fff;border:2px solid var(--line);border-radius:1rem}
.va-kpi span{font-weight:700;color:var(--ink2)}
.va-kpi strong{font-size:1.8rem;line-height:1.3}
.va-kpi small{color:var(--ink2);font-size:.92rem}
.va-moneyrow{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.9rem 1.1rem;background:#fff;border:2px solid var(--line);border-radius:1rem}
.va-moneyrow span{display:block;color:var(--ink2);font-size:.95rem}
.va-moneyrow b{font-size:1.2rem}
.va-bar{margin-bottom:1rem}
.va-bar:last-child{margin-bottom:0}
.va-bar-top{display:flex;justify-content:space-between;font-weight:700}
.va-bar-track{height:1rem;margin-top:.3rem;border-radius:999px;background:var(--bg);overflow:hidden}
.va-bar-track div{height:100%;border-radius:999px;background:var(--teal)}

/* モーダル */
.va-modal-wrap{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:1rem;background:rgba(10,30,28,.55)}
.va-modal{width:min(36rem,100%);max-height:calc(100vh - 2rem);display:flex;flex-direction:column;background:#fff;border-radius:1.2rem;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.va-modal-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1.1rem 1.3rem;border-bottom:1px solid var(--line)}
.va-modal-head h2{margin:0;font-size:1.25rem;line-height:1.4}
.va-modal-body{padding:1.1rem 1.3rem;overflow:auto}
.va-modal-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:.6rem;padding:1rem 1.3rem;border-top:1px solid var(--line)}
.va-detail-state{display:flex;gap:.5rem;margin-bottom:.4rem}

/* お知らせ（取り消し付き） */
.va-toasts{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:.6rem;width:min(34rem,calc(100vw - 2rem))}
.va-toast{display:flex;align-items:center;gap:.7rem;padding:.8rem .8rem .8rem 1.1rem;background:#13302d;color:#fff;border-radius:1rem;box-shadow:0 10px 30px rgba(0,0,0,.25);font-weight:700;opacity:0;transform:translateY(1rem);transition:opacity .25s,transform .25s}
.va-toast.show{opacity:1;transform:none}
.va-toast-ic{color:#8fe0ae}
.va-toast-msg{flex:1}
.va-toast-undo{min-height:2.8rem;padding:.3rem 1rem;border:2px solid #fff;border-radius:.7rem;background:transparent;color:#fff;font-weight:700;cursor:pointer;white-space:nowrap}
.va-toast-undo:hover{background:#fff;color:#13302d}
.va-toast-x{display:grid;place-items:center;width:2.6rem;height:2.6rem;border:0;border-radius:.6rem;background:transparent;color:#fff;cursor:pointer}

/* タブレット */
@media (max-width:1100px){.va-shell{grid-template-columns:13rem 1fr}.va-content{padding:1.4rem 1.4rem 4rem}.va-head{padding:.8rem 1.4rem}.va-two{grid-template-columns:1fr}}
/* スマホ：下にメニュー、表はカードに */
@media (max-width:760px){
  .va-shell{display:block}
  .va-side{display:none}
  .va-head{padding:.7rem 1rem;flex-wrap:wrap}
  .va-head h1{font-size:1.35rem}
  .va-head-r{width:100%;justify-content:space-between}
  .va-fs-l{display:none}
  .va-hide-sm{display:none}
  .va-content{padding:1rem 1rem 7.5rem}
  .va-tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding:.3rem .2rem calc(.3rem + env(safe-area-inset-bottom))}
  .va-tabbar .va-nav-btn{flex-direction:column;justify-content:center;gap:.1rem;min-height:3.9rem;padding:.3rem .1rem;color:var(--ink2);font-size:.82rem;text-align:center;border-radius:.8rem}
  .va-tabbar .va-nav-btn .va-ic{width:1.5rem;height:1.5rem}
  .va-tabbar .va-nav-btn span{font-size:.72rem;white-space:nowrap;letter-spacing:-.02em}
  .va-tabbar .va-nav-btn.on{background:var(--ok-bg);color:var(--teal)}
  .va-tabbar .va-badge{position:absolute;top:.15rem;right:calc(50% - 1.6rem);margin:0;min-width:1.35rem;height:1.35rem;font-size:.75rem}
  .va-toasts{bottom:5.6rem}
  .va-todo{flex-direction:column;gap:.6rem;padding:1rem}
  .va-todo-ic{width:2.6rem;height:2.6rem}
  .va-bk-main{flex-wrap:wrap;gap:.5rem 1rem;padding:.9rem}
  .va-bk-time{min-width:0;text-align:left}
  .va-bk-time strong{display:inline;margin-left:.3rem}
  .va-bk-date{display:inline}
  .va-bk-body{flex-basis:100%}
  .va-bk-more{position:absolute;right:1.4rem;margin-top:.15rem}
  .va-bk{position:relative}
  .va-bk-actions{padding:0 .9rem .9rem}
  .va-bk-actions .va-btn{flex:1}
  .va-bigchoice,.va-grid3,.va-kpis{grid-template-columns:1fr}
  .va-choice{min-height:0}
  .va-days{grid-template-columns:repeat(4,1fr)}
  .va-q{padding:1.1rem}
  .va-q-t{font-size:1.25rem}
  .va-row{grid-template-columns:1fr;gap:0}
  .va-steps li{font-size:0;padding:.3rem}
  .va-steps li.on{font-size:.9rem;padding-right:.8rem}
  .va-wiz-nav .va-btn-lg{width:100%}
  .va-weeknav strong{order:-1;width:100%;text-align:center}
  .va-weeknav .va-btn{flex:1}
  .va-modal-wrap{align-items:end;padding:0}
  .va-modal{border-radius:1.2rem 1.2rem 0 0;max-height:92vh}
  .va-modal-actions .va-btn{flex:1}
}

/* 電話予約：空き状況の一覧表（元の画面と同じ形式） */
.va-slotcard{padding:1.3rem 1.4rem 1rem}
.va-slot-top{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;padding-bottom:1rem;border-bottom:1px solid #e3ebe7}
.va-slot-week{display:flex;align-items:center;gap:.8rem}
.va-slot-week strong{font-size:1.05rem;white-space:nowrap}
.va-icon-only{display:grid;place-items:center;width:2.8rem;height:2.8rem;border:2px solid var(--line);border-radius:.8rem;background:#fff;cursor:pointer;color:var(--ink)}
.va-icon-only:hover{border-color:var(--teal)}
.va-icon-only:disabled{opacity:.35;cursor:not-allowed}
.va-slot-tabs{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0}
.va-slot-tab{min-height:2.9rem;padding:.4rem 1.2rem;border:2px solid var(--line);border-radius:999px;background:#fff;font-weight:700;cursor:pointer}
.va-slot-tab:hover{border-color:var(--teal)}
.va-slot-tab.on{background:var(--teal);border-color:var(--teal);color:#fff}
.va-slot-scroll{overflow-x:auto;border:1px solid #dfe8e3;border-radius:1rem}
.va-slot-table{width:100%;min-width:40rem;border-collapse:collapse;table-layout:fixed;font-variant-numeric:tabular-nums}
.va-slot-table th,.va-slot-table td{border-bottom:1px solid #e6ece9;border-left:1px solid #e6ece9;text-align:center;padding:0}
.va-slot-table tr>*:first-child{border-left:0}
.va-slot-table tbody tr:last-child>*{border-bottom:0}
.va-slot-table thead th{background:#f3f6f4;padding:.55rem .2rem;font-size:.92rem;line-height:1.3}
.va-slot-th{width:5.2rem;font-size:.9rem}
.va-slot-day span{font-size:.85rem}
.va-slot-day.sat{color:#2463a8}.va-slot-day.sun{color:#c0392b}
.va-slot-day.today{box-shadow:inset 0 -3px 0 var(--teal)}
.va-slot-time{background:#f8faf9;font-weight:700;padding:.5rem .3rem}
.va-slot button{display:grid;place-items:center;width:100%;height:3.2rem;border:0;background:transparent;font-size:1.35rem;line-height:1;cursor:pointer}
.va-slot.free button{color:#b8486c}
.va-slot.busy{background:#fff8e7}
.va-slot.busy button{color:#b07a16}
.va-slot.none{color:#9aa6a3;height:3.2rem;font-size:1.2rem}
.va-slot button:hover{background:#eef6f1}
.va-slot.sel{background:#e3f3ea}
.va-slot.sel button{color:var(--teal);font-weight:700;box-shadow:inset 0 0 0 3px var(--teal);border-radius:.4rem}
.va-slot-legend{display:flex;flex-wrap:wrap;gap:1.2rem;margin:.8rem 0 0;font-size:.92rem;color:var(--ink2);font-weight:700}
.va-slot-legend b{margin-right:.3rem;font-size:1.1rem}
.m-free{color:#b8486c}.m-busy{color:#b07a16}.m-none{color:#9aa6a3}
.va-slot-sel{display:flex;align-items:center;gap:1rem;margin-top:1rem;padding:1rem 1.2rem;background:#fff;border:2px solid var(--line);border-radius:1rem}
.va-slot-sel small{display:block;color:var(--ink2);font-weight:700}
.va-slot-sel strong{font-size:1.15rem;margin-right:.6rem}
.va-muted{color:var(--ink2);font-weight:500 !important}
@media (max-width:760px){
  .va-slotcard{padding:1rem}
  .va-slot-week{width:100%;justify-content:space-between}
  .va-slot-tab{flex:1;padding:.4rem .6rem}
  .va-steps li{font-size:.85rem;padding-right:.7rem}
}

/* 経路・種別のタグ */
.va-tag-k{background:#eef0fb;border-color:#b9c0ea;color:#33408f}
.va-tag-d{background:#fff;border-color:#9fd1b1;color:#1b6a3f}
.st-k-bg{background:#eef0fb;color:#33408f}
.va-legend-sep{display:inline-block;width:1px;height:1.2rem;background:var(--line);margin:0 .4rem}
/* 重なりの注意 */
.va-warn{display:flex;gap:.4rem;align-items:flex-start;margin:.45rem 0 0;padding:.45rem .7rem;border-radius:.6rem;background:#fff4e5;color:#8a4b0f;font-size:.9rem;font-weight:700;line-height:1.5}
.va-warn .va-ic{margin-top:.15rem}
.va-conflict{display:flex;gap:.6rem;align-items:flex-start;padding:.8rem 1rem;border-radius:.9rem;background:#fff;border:2px solid #f2c18a;font-weight:700;color:#7a430c}
.va-conflict .va-ic{margin-top:.2rem;color:#c2410c}
.va-alloc{display:flex;justify-content:space-between;align-items:center;gap:.8rem;flex-wrap:wrap;padding:.8rem 1rem;background:#fff;border:2px solid var(--line);border-radius:.9rem;margin-bottom:.6rem}
.va-alloc>div{min-width:0;flex:1}
.va-alloc strong{display:block}
.va-alloc span{color:var(--ink2);font-size:.92rem}
.va-alloc .va-chip span,.va-alloc .va-warn span{color:inherit}
/* 立場の切り替え */
.va-role{display:flex;align-items:center;gap:.25rem;padding:.25rem;border:2px solid #b9c0ea;border-radius:999px;background:#f5f6fd}
.va-role-l{padding:0 .5rem;font-size:.85rem;font-weight:700;color:#33408f}
.va-role button{min-height:2.6rem;padding:0 1rem;border:0;border-radius:999px;background:transparent;font-weight:700;cursor:pointer;color:#33408f}
.va-role button.on{background:#33408f;color:#fff}
.va-side-k{background:#1d2f57}
.va-side-k .va-nav-btn.on{color:#1d2f57}
.va-side-k .va-brand .va-ic{color:#b9c0ea}
.va-side-k .va-brand small,.va-side-k .va-owner small{color:#b9c0ea}
/* 修学旅行の案件 */
.va-case{padding:1.3rem 1.4rem}
.va-case-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap}
.va-stage{display:flex;gap:.3rem;margin:1rem 0;padding:0;list-style:none;flex-wrap:wrap}
.va-stage li{display:flex;align-items:center;gap:.35rem;padding:.25rem .75rem .25rem .25rem;border-radius:999px;background:var(--bg);font-size:.9rem;font-weight:700;color:var(--ink2)}
.va-stage li span{display:grid;place-items:center;width:1.6rem;height:1.6rem;border-radius:999px;background:#fff;font-size:.8rem}

<script>
/* ログイン（モック）。パスワードはこのパソコンのブラウザの中に、暗号化（ハッシュ）して保存する。
   本番はGoogleアカウントでログインし、許可したスタッフだけが入れる（バックエンド構築後） */
(function () {
  'use strict';
  var SKEY = 'oshino-kyokai-staff', LKEY = 'oshino-kyokai-session', MIN = 8;
  var DEF = [{ email: 'n.ohmae@aiinnovation.jp', name: '大前', role: '管理者' }];
  function list() { try { var l = JSON.parse(localStorage.getItem(SKEY) || 'null'); if (l && l.length) return l; } catch (e) {} return DEF.slice(); }
  function saveList(l) { try { localStorage.setItem(SKEY, JSON.stringify(l)); } catch (e) {} }
  function session() { try { return JSON.parse(sessionStorage.getItem(LKEY) || 'null'); } catch (e) { return null; } }
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  function hash(email, pw) {
    var text = 'oshino:' + String(email).toLowerCase() + ':' + pw;
    if (window.crypto && crypto.subtle && window.TextEncoder) {
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function (buf) { return Array.prototype.map.call(new Uint8Array(buf), function (x) { return ('0' + x.toString(16)).slice(-2); }).join(''); });
    }
    var h = 5381; for (var i = 0; i < text.length; i++) h = ((h << 5) + h + text.charCodeAt(i)) >>> 0; return Promise.resolve('d' + h.toString(16));
  }
  function find(email) { return list().filter(function (x) { return String(x.email).toLowerCase() === String(email).toLowerCase(); })[0]; }
  function setPassword(email, pw, mustChange) {
    return hash(email, pw).then(function (h) { var l = list(); l.forEach(function (x) { if (String(x.email).toLowerCase() === String(email).toLowerCase()) { x.pw = h; x.mustChange = !!mustChange; } }); saveList(l); });
  }
  function checkRule(pw) { return pw && pw.length >= MIN ? '' : 'パスワードは' + MIN + '文字以上にしてください。'; }
  window.__oshinoStaff = session;
  window.__oshinoStaffList = { get: list, set: saveList };
  window.__oshinoAuth = {
    MIN: MIN, rule: checkRule, setPassword: setPassword,
    // 自分のパスワードを変える（今のパスワードを確かめてから）
    change: function (email, cur, next) {
      var who = find(email); if (!who) return Promise.resolve('ログインできる人に登録されていません。');
      var r = checkRule(next); if (r) return Promise.resolve(r);
      return hash(email, cur).then(function (h) { if (who.pw && h !== who.pw) return '今のパスワードがちがいます。'; return setPassword(email, next, false).then(function () { return ''; }); });
    }
  };
  window.__oshinoLogout = function () { sessionStorage.removeItem(LKEY); show(''); };
  var el = null, pending = null;
  function card(inner) {
    if (!el) { el = document.createElement('div'); el.id = 'oshino-login'; document.body.appendChild(el); el.addEventListener('submit', submit); }
    el.hidden = false; document.documentElement.classList.add('ol-locked');
    el.innerHTML = '<form class="ol-card" novalidate><p class="ol-kicker">忍野村観光協会</p>' + inner + '</form>';
    setTimeout(function () { var i = el.querySelector('input'); if (i) i.focus(); }, 0);
  }
  function show(msg) {
    pending = null;
    card('<h1>予約管理にログイン</h1>' +
      '<label class="ol-f">メールアドレス<input type="email" id="ol-mail" autocomplete="username" placeholder="例：n.ohmae@aiinnovation.jp"></label>' +
      '<label class="ol-f">パスワード<input type="password" id="ol-pass" autocomplete="current-password"></label>' +
      (msg ? '<p class="ol-err" role="alert">' + esc(msg) + '</p>' : '') + '<button type="submit" class="ol-btn">ログイン</button>' +
      '<p class="ol-note">パスワードを忘れたときは、管理者に「パスワードの再設定」を頼んでください。本番では、Googleアカウントのログイン画面に変わります。</p>');
  }
  // 初めてのログイン、または管理者が再設定したあとは、自分のパスワードを決めてもらう
  function showSet(who, msg) {
    pending = who;
    card('<h1>パスワードを決める</h1><p class="ol-lead">' + esc(who.name) + ' さん、' + (who.pw ? '管理者がパスワードを再設定しました。' : '初めてのログインです。') + 'これから使うパスワードを決めてください（' + MIN + '文字以上）。</p>' +
      '<label class="ol-f">新しいパスワード<input type="password" id="ol-new" autocomplete="new-password"></label>' +
      '<label class="ol-f">もう一度<input type="password" id="ol-new2" autocomplete="new-password"></label>' +
      (msg ? '<p class="ol-err" role="alert">' + esc(msg) + '</p>' : '') + '<button type="submit" class="ol-btn">このパスワードにする</button>');
  }
  function enter(who) {
    sessionStorage.setItem(LKEY, JSON.stringify({ email: who.email, name: who.name, role: who.role, at: Date.now() }));
    el.hidden = true; document.documentElement.classList.remove('ol-locked');
    try { window.dispatchEvent(new CustomEvent('oshino-login')); } catch (er) {}
  }
  function submit(e) {
    e.preventDefault();
    if (pending) {
      var a = document.getElementById('ol-new').value || '', b = document.getElementById('ol-new2').value || '';
      var r = checkRule(a); if (r) { showSet(pending, r); return; }
      if (a !== b) { showSet(pending, '2つのパスワードが同じではありません。'); return; }
      var who = pending; setPassword(who.email, a, false).then(function () { enter(find(who.email)); });
      return;
    }
    var mail = (document.getElementById('ol-mail').value || '').trim().toLowerCase(), pass = document.getElementById('ol-pass').value || '';
    if (!mail || !pass) { show('メールアドレスとパスワードを入れてください。'); return; }
    var who = find(mail);
    if (!who) { show('このメールアドレスは、ログインできる人として登録されていません。管理者に登録を頼んでください。'); return; }
    if (!who.pw) { showSet(who, ''); return; } // パスワードがまだない人は、ここで決めてもらう
    hash(mail, pass).then(function (h) {
      if (h !== who.pw) { show('パスワードがちがいます。'); return; }
      if (who.mustChange) { showSet(who, ''); return; }
      enter(who);
    });
  }
  function start() { if (!session()) show(''); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>

    const t = setTimeout(close, undoSnapshot ? 8000 : 2500);

    if (undoSnapshot) el.querySelector('.va-toast-undo').onclick = () => {

      roomWarn(g) + row('人数', g.people + '名（' + (g.breakdown || '内訳なし') + '）') + row('客室', (g.rooms || '—') + '室（残り' + roomsLeft(g) + '室／全' + (DB.ROOMS[g.stayId] || '—') + '室）') + row('食事', g.meals || '—') + row('交通', g.bus || '—') + row('要望', g.note || '—') + (expOfGroup(g) ? row('体験', expOfGroup(g)) : '') +
      (ky ? rowTel('連絡先', KY.name + ' ' + STAFF(), KY.phone) + row('案件番号', g.caseId || '—') : rowTel('代表者', g.contact + ' 様', g.phone) + row('メール', g.email || '—')) + row('受付日時', g.receivedAt) +
      (ky ? '<p class="va-hint">学校との連絡は観光協会が行います。</p>' : '') +
      (isKyokai() && !ky ? '<p class="va-hint">閲覧のみ（対応は事業者）</p>' : '') + (g.taker ? row('電話受付', g.taker) : '') + mailSection('g', g);
    const canExp = !isKyokai() && active(g) && g.status === 'ok' && !g.expId && groupExp(g);
    openModal('団体宿泊｜' + g.org, body, groupActions(g, true) + (canExp ? '<button type="button" class="va-btn" data-act="g-exp" data-id="' + g.id + '">' + ic('plus') + '体験も手配する（' + esc(canExp) + '）</button>' : '') +
      (isKyokai() ? telBtn(info.phone, '宿に電話') : '') + '<button type="button" class="va-btn" data-act="modal-close">閉じる</button>');
  }
  const expOfGroup = (g) => { const b = g.expId && D().bookings.find((x) => x.id === g.expId); return b ? b.product + ' ' + sd(b.date) + ' ' + b.time + '（' + STATE[b.status].label + '）' : ''; };
  function showStay(id) {
    const s = D().stays.find((x) => x.id === id); if (!s) return; const info = DB.stayInfo(s.stayId);
    openModal('宿泊｜' + s.name + ' 様', '<div class="va-detail-state">' + chip(s.status) + routeTag(s) + kindTag(s) + '</div>' +
      routeTag(s) + row('予約番号', s.id) + row('宿泊先', info.name + '（' + info.room + '）') + row('日程', jpDate(s.checkin) + ' 〜 ' + jpDate(s.checkout)) + row('人数・室数', s.guests) +
      rowTel('氏名', s.name + ' 様', s.phone) + row('メール', s.email || '—') + row('受付日時', s.receivedAt) +
      (s.via === 'phone' ? row('電話受付', s.taker || '—') : '<p class="va-hint">オンライン予約（即時確定）</p>') + mailSection('s', s),
      (!isKyokai() && s.unseen ? '<button type="button" class="va-btn va-btn-primary" data-act="seen" data-id="' + s.id + '" data-modal="1">' + ic('check') + '確認済みにする</button>' : '') +
      (isKyokai() ? telBtn(info.phone, '宿に電話') : '') + '<button type="button" class="va-btn" data-act="modal-close">閉じる</button>');
  }

  // 予約ごとのボタン（観光協会の画面は閲覧のみ）
  function bookingActions(b, inModal) {
    if (isKyokai() && b.status === 'ok' && !b.cancelled && inModal) return '<button type="button" class="va-btn" data-act="bk-change" data-id="' + b.id + '">' + ic('cal') + '予約を変更</button><button type="button" class="va-btn va-btn-ghost" data-act="bk-cancel" data-id="' + b.id + '">キャンセル・中止</button>';
    if (isKyokai() && (b.route === 'kyokai' || b.status !== 'wait')) return '';
    const m = inModal ? ' data-modal="1"' : '';
    if (b.status === 'wait' && b.route === 'kyokai') return '<button type="button" class="va-btn va-btn-primary" data-act="kyokai-ok" data-id="' + b.id + '"' + m + '>' + ic('check') + '受入確認</button>';
    if (b.status === 'wait') return '<button type="button" class="va-btn va-btn-primary" data-act="accept" data-id="' + b.id + '"' + m + '>' + ic('check') + (isKyokai() ? '予約を確定する' : '受け入れる') + '</button>' +
      '<button type="button" class="va-btn va-btn-ghost" data-act="decline" data-id="' + b.id + '"' + m + '>お断りする</button>';
    if (b.status === 'ok') return '<button type="button" class="va-btn va-btn-primary" data-act="checkin" data-id="' + b.id + '"' + m + '>' + ic('door') + '受付する</button>';
    return '';
  }
  function groupActions(g, inModal) {
    if (isKyokai()) return '';
    const m = inModal ? ' data-modal="1"' : '';
    if (g.status === 'wait' && g.route === 'kyokai') return '<button type="button" class="va-btn va-btn-primary" data-act="g-kyokai-ok" data-id="' + g.id + '"' + m + '>' + ic('check') + '受入確認</button>';
    if (g.status === 'wait') return '<button type="button" class="va-btn va-btn-primary" data-act="g-accept" data-id="' + g.id + '"' + m + '>' + ic('check') + '受け入れる</button>' +
      '<button type="button" class="va-btn va-btn-ghost" data-act="g-decline" data-id="' + g.id + '"' + m + '>お断りする</button>';
    return '';
  }

  function bookingCard(b, opts = {}) {
    return '<article class="va-bk ' + STATE[b.status].cls + '-edge">' +
      '<button type="button" class="va-bk-main" data-act="detail" data-id="' + b.id + '" aria-label="' + esc(b.name) + '様の予約詳細">' +
      '<div class="va-bk-time">' + (opts.showDate ? '<span class="va-bk-date">' + sd(b.date) + '</span>' : '') + '<strong>' + b.time + '</strong></div>' +
      '<div class="va-bk-body"><div class="va-bk-top">' + chip(b.status) + '</div>' +
      '<p class="va-bk-name">' + esc(b.name) + ' <span>様・' + b.people + '名・' + esc(b.product) + '</span></p>' +
      '<p class="va-bk-meta">' + esc(b.product) + '・' + esc(b.payment) + '・' + contactText(b) + '</p>' + warnLine(b) + '<p class="va-bk-mail">' + mailBadge(b) + '</p></div>' +
      '<span class="va-bk-more"><span class="va-sr">詳細</span>' + ic('right') + '</span></button>' +
      (bookingActions(b) ? '<div class="va-bk-actions">' + bookingActions(b) + '</div>' : '') + '</article>';
  }
  function groupCard(g) {
    const info = DB.stayInfo(g.stayId);
    return '<article class="va-bk ' + STATE[g.status].cls + '-edge">' +
      '<button type="button" class="va-bk-main" data-act="g-detail" data-id="' + g.id + '" aria-label="' + esc(g.org) + 'の宿泊予約詳細">' +
      '<div class="va-bk-time"><span class="va-bk-date">' + sd(g.from) + '</span><strong>' + nights(g.from, g.to) + '泊</strong></div>' +
      '<div class="va-bk-body"><div class="va-bk-top">' + chip(g.status) + routeTag(g) + extraTag(g) + '</div>' +
      '<p class="va-bk-name">' + esc(g.org) + ' <span>様・' + g.people + '名・' + esc(g.rooms || '—') + '室</span></p>' +
      '<p class="va-bk-meta">' + (isKyokai() ? esc(info.name) + '・' : '') + sd(g.from) + '〜' + sd(g.to) + '・' + contactText(g) + '</p>' + warnLine(g) + roomWarn(g) + '<p class="va-bk-mail">' + mailBadge(g) + '</p></div>' +
      '<span class="va-bk-more"><span class="va-sr">詳細</span>' + ic('right') + '</span></button>' +
      (groupActions(g) ? '<div class="va-bk-actions">' + groupActions(g) + '</div>' : '') + '</article>';
  }
  function stayCard(s, opts = {}) {
    const info = DB.stayInfo(s.stayId);
    return '<article class="va-bk ' + STATE[s.status].cls + '-edge"><button type="button" class="va-bk-main" data-act="s-detail" data-id="' + s.id + '" aria-label="' + esc(s.name) + '様の宿泊予約詳細">' +
      '<div class="va-bk-time"><span class="va-bk-date">' + sd(s.checkin) + '</span><strong>' + nights(s.checkin, s.checkout) + '泊</strong></div>' +
      '<div class="va-bk-body"><div class="va-bk-top">' + chip(s.status) + routeTag(s) + '</div><p class="va-bk-name">' + esc(s.name) + ' <span>様・' + esc(s.guests) + '</span></p>' +
      '<p class="va-bk-meta">' + (isKyokai() ? esc(info.name) + '・' : '') + sd(s.checkin) + '〜' + sd(s.checkout) + '・' + esc(s.phone) + '</p><p class="va-bk-mail">' + routeTagIf(s) + mailBadge(s) + '</p></div><span class="va-bk-more"><span class="va-sr">詳細</span>' + ic('right') + '</span></button>' +
      (opts.seen && !isKyokai() ? '<div class="va-bk-actions"><button type="button" class="va-btn va-btn-primary" data-act="seen" data-id="' + s.id + '">' + ic('check') + '確認済みにする</button></div>' : '') + '</article>';
  }
  const routeTagIf = () => '';
  const stayList = () => V().groups.map((g) => ({ k: 'g', d: g.from, x: g })).concat(V().stays.map((s) => ({ k: 's', d: s.checkin, x: s }))).sort((a, b) => a.d.localeCompare(b.d));
  const stayCardOf = (o) => o.k === 'g' ? groupCard(o.x) : stayCard(o.x);

  // ---------- 画面：本日（事業者） ----------
  const todoBox = (icon, iconCls, inner) => '<section class="va-todo"><div class="va-todo-ic ' + iconCls + '">' + ic(icon) + '</div><div class="va-todo-body">' + inner + '</div></section>';
  function pageToday() {
    if (isKyokai()) return pageKToday();
    const t = todays();
    const kyB = V().bookings.filter((b) => b.route === 'kyokai' && b.status === 'wait').sort(byTime);
    const kyG = V().groups.filter((g) => g.route === 'kyokai' && g.status === 'wait');
    const waits = V().bookings.filter((b) => b.route !== 'kyokai' && b.status === 'wait').sort(byTime);
    const gWaits = V().groups.filter((g) => g.route !== 'kyokai' && g.status === 'wait');
    const oks = t.filter((b) => b.status === 'ok');
    const news = V().stays.filter((x) => x.unseen && active(x)).sort((a, b) => a.checkin.localeCompare(b.checkin));
    const rainTargets = t.filter((b) => b.time === '13:00' || b.time === '14:00');
    const rainPeople = rainTargets.reduce((a, b) => a + b.people, 0);
    let todo = '', n = 0;
    if (D().weather === 'pending' && rainTargets.length) {
      n++;
      todo += '<section class="va-todo va-todo-alert"><div class="va-todo-ic">' + ic('rain') + '</div><div class="va-todo-body">' +
        '<p class="va-todo-kicker">11:00までに判断</p><h3>午後に強い雨の予報　<span class="va-h3-sub">13:00・14:00（' + rainTargets.length + '組・' + rainPeople + '名）</span></h3><div class="va-todo-actions">' +
        '<button type="button" class="va-btn va-btn-primary va-btn-lg" data-act="rain-accept">' + ic('check') + '予定どおり実施</button>' +
        '<button type="button" class="va-btn va-btn-lg" data-act="rain-decline">中止にする</button></div></div></section>';
    }
    if (kyB.length + kyG.length) {
      n++;
      todo += todoBox('flag', 'st-k-bg', '<h3>観光協会からの手配 <b class="va-num">' + (kyB.length + kyG.length) + '件</b></h3>' +
        '<div class="va-stack">' + kyG.map(groupCard).join('') + kyB.map((b) => bookingCard(b, { showDate: b.date !== TODAY })).join('') + '</div>');
    }
    if (news.length) {
      n++;
      todo += todoBox('bell', 'st-ok-bg', '<h3>新着の予約（確定済み） <b class="va-num">' + news.length + '件</b></h3>' +
        '<div class="va-stack">' + news.map((x) => stayCard(x, { seen: true })).join('') + '</div>');
    }
    if (gWaits.length) {
      n++;
      todo += todoBox('users', 'st-info-bg', '<h3>団体宿泊の申込 <b class="va-num">' + gWaits.length + '件</b></h3>' +
        '<div class="va-stack">' + gWaits.map(groupCard).join('') + '</div>');
    }
    if (waits.length) {
      n++;
      todo += todoBox('alert', 'st-wait-bg', '<h3>体験の依頼 <b class="va-num">' + waits.length + '件</b></h3>' +
        '<div class="va-stack">' + waits.map((b) => bookingCard(b, { showDate: b.date !== TODAY })).join('') + '</div>');
    }
    if (oks.length) {
      n++;
      todo += todoBox('door', 'st-ok-bg', '<h3>本日の来場 <b class="va-num">' + oks.length + '組</b></h3>' +
        '<div class="va-stack">' + oks.map((b) => bookingCard(b)).join('') + '</div>');
    }
    if (!n) todo = '<section class="va-alldone">' + ic('check') + '<h3>本日の対応はすべて完了しました</h3><p>お疲れさまでした。本日の予定は下に表示しています。</p></section>';
    const total = t.reduce((a, b) => a + b.people, 0);
    const staying = V().groups.filter((g) => active(g) && g.status !== 'wait' && g.from <= TODAY && TODAY < g.to).length + V().stays.filter((s) => s.checkin <= TODAY && TODAY < s.checkout).length;
    return '<div class="va-intro"><h2 class="va-h2">本日の対応 <span class="va-count">' + n + '</span></h2></div>' + todo +
      (isStayFac() ? '<h2 class="va-h2 va-mt">本日の宿泊　<span class="va-h2-sub">' + staying + '件</span></h2>' + (staying ? '<div class="va-stack">' + stayList().filter((o) => active(o.x) && o.x.status !== 'wait' && (o.k === 'g' ? o.x.from <= TODAY && TODAY < o.x.to : o.x.checkin <= TODAY && TODAY < o.x.checkout)).map(stayCardOf).join('') + '</div>' : '<p class="va-empty">本日の宿泊はありません。</p>')
        : '<h2 class="va-h2 va-mt">本日の予定　<span class="va-h2-sub">体験 ' + t.length + '組・合計' + total + '名</span></h2>' + schedList(t));
  }

  function schedList(list) {
    if (!list.length) return '<p class="va-empty">予定はありません。</p>';
    return '<div class="va-sched">' + list.map((b) => '<button type="button" class="va-sched-row" data-act="detail" data-id="' + b.id + '"><b>' + b.time + '</b><span class="va-sched-name">' + esc(b.name) + ' 様・' + b.people + '名</span><span class="va-sched-prod">' + esc(b.product) + '</span>' + chip(b.status) + routeTag(b) + ic('right', 'va-sched-arrow') + '</button>').join('') + '</div>';
  }

  // ---------- 画面：本日（観光協会） ----------
  const STAGES = ['相談受付', '手配中', '見積提出', '確定', '実施', '精算'];
  // ---------- 本日：今日やることリスト（お知らせと同じ中身）＋今日・明日の体験 ----------
  function pageKToday() {
    const items = noticeItems(), today = DB.clock(), tomorrow = addDays(today, 1);
    let html = '', grp = '';
    items.forEach((x) => {
      if (x.g !== grp) { grp = x.g; html += '<p class="va-do-g">' + esc(grp) + '</p>'; }
      if (x.o) { html += conflictRow(x.o); return; }
      const tel = x.b && /電話/.test(x.g + x.s) ? (x.g.indexOf('民宿') >= 0 ? (DB.innOf(x.b.venue) || {}).tel : x.b.phone) : '';
      html += '<div class="va-do"><div><strong>' + esc(x.t) + '</strong><small>' + esc(x.s) + '</small></div>' + (tel ? telBtn(tel, '電話する') : '') +
        (x.q ? '<button type="button" class="va-btn va-btn-primary" data-act="notice-inq" data-v="' + esc(x.q.id) + '">開く</button>' : '<button type="button" class="va-btn va-btn-primary" data-act="detail" data-id="' + x.b.id + '">開く</button>') + '</div>';
    });
    const soon = D().bookings.filter((b) => !b.cancelled && (b.date === today || b.date === tomorrow)).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
    return '<section class="va-do-box"><h2 class="va-h2">今日やること <b class="va-num">' + items.length + '件</b></h2>' +
      (items.length ? '<p class="va-p">上から順に「開く」を押して進めてください。終わったものは、このリストから自動で消えます。</p>' + html
        : '<p class="va-do-none">' + ic('check') + '今日やることは、ありません。</p>') + '</section>' +
      '<section class="va-do-box"><div class="va-do-h"><h2 class="va-h2">今日と明日の体験</h2><button type="button" class="va-btn va-btn-sm" data-act="print-sched">' + ic('file') + '1週間分の予定を印刷</button></div>' +
      (soon.length ? soon.map((b) => '<div class="va-do"><div><strong>' + (b.date === today ? '今日' : '明日') + ' ' + esc(b.time) + '　' + esc(b.product) + '・' + b.people + '名</strong><small>' + esc((b.group && b.group !== '個人' ? b.group + ' ' : '') + b.name) + ' 様・会場 ' + esc(b.venue || '未定') + (b.status === 'wait' ? '・まだ確定していません' : '') + '</small></div><button type="button" class="va-btn" data-act="detail" data-id="' + b.id + '">開く</button></div>').join('')
        : '<p class="va-p">今日と明日の体験は、ありません。</p>') + '</section>';
  }

  function alInfo(b) {
    if (b.cancelled || b.status === 'wait') return null;
    const a = b.allergy;
    if (!a) return { key: 'pending', n: 0, alt: 0, sev: 0, text: 'アレルギー未回答' };
    if (!a.count) return { key: 'none', n: 0, alt: 0, sev: 0, text: 'アレルギーなし', inn: !!a.innNote };
    const ppl = a.people || [];
    const alt = ppl.length ? ppl.filter((r) => r.cat === 'alt').length : (Number(a.altCount) || 0);
    const sev = ppl.filter((r) => r.cat === 'severe').length;
    const ana = ppl.some((r) => r.ana === '有' || r.epi === '有');
    const innDone = ppl.length ? ppl.every((r) => (r.howTo || '').trim()) : !!a.innNote;
    return { key: 'yes', n: a.count, alt, sev, ana, inn: innDone, text: 'アレルギーあり ' + a.count + '名' };
  }
  function alTags(b, opts = {}) {
    const i = alInfo(b); if (!i) return '';
    let h = '<span class="va-al va-al-' + i.key + '">' + ic(i.key === 'none' ? 'check' : 'alert') + esc(i.text) + (i.key === 'yes' && i.sev ? '（重度 ' + i.sev + '）' : '') + '</span>';
    if (i.key === 'yes') {
      h += i.alt ? '<span class="va-al va-al-alt">代替食が必要 ' + i.alt + '名</span>' : '<span class="va-al va-al-noalt">代替食なし</span>';
      if (i.ana) h += '<span class="va-al va-al-yes">アナフィラキシー・エピペンあり</span>';
      if (!opts.short) h += i.inn ? '<span class="va-al va-al-inn">民宿の対応 記入済み</span>' : '<span class="va-al va-al-pending">民宿の対応 未記入</span>';
    }
    return h;
  }

  // ---------- 予約後の手続き（自動メール） ----------
  const AUTO_ST = {
    sent: ['送信済み', 'ok', 'check'], due: ['送信待ち', 'wait', 'clock'], planned: ['送信予定', 'plan', 'clock'],
    wait: ['条件待ち', 'plan', 'clock'], skip: ['送らない', 'skip', 'minus'], off: ['オフ', 'skip', 'minus']
  };
  const fileBtns = (files, b) => (files || []).map((f) => '<button type="button" class="va-file" data-act="doc-view" data-v="' + f.kind + '" data-id="' + esc(b.id) + '">' + ic(f.kind === 'map' ? 'mountain' : 'file') + esc(f.name) + '</button>').join('');
  const prepState = (b) => {
    const dl = DB.deadlines(b), pay = DB.isPay(b);
    return {
      allergy: b.allergy ? { ok: true, text: '回答済み（対象者 ' + b.allergy.count + '名）' } : { ok: false, text: '未回答（期限 ' + sd(dl.allergy) + '）', late: dl.allergy < DB.clock() },
      pay: !pay ? { ok: true, na: true, text: (b.payment || '—') + '（振込以外）' } : b.paid ? { ok: true, text: '入金確認済み（' + sd(b.paidOn) + '）' }
        : b.payReported ? { ok: false, rep: true, text: '振込のご報告あり（' + b.payReported + '）・入金未確認' } : { ok: false, text: '未入金（期限 ' + sd(dl.pay) + '）', late: dl.pay < DB.clock() }
    };
  };
  const inPrep = (b) => !b.cancelled && b.status === 'ok' && b.email && b.confirmedOn;
  function flowSection(b) {
    if (b.cancel) return '<div class="va-flow va-flow-pre">' + ic('alert') + '<p><b>' + (b.cancel.reason === 'rain' ? '雨天中止' : 'キャンセル') + '（' + esc(b.cancel.at) + '）</b><br>' + esc(b.cancelInfo || '').replace(/\n/g, '<br>') + '<br>自動メールはすべて止まっています。</p></div>';

  // ---------- キャンセル料（予約サイトのキャンセルポリシーと同じ） ----------
  function cancelCalc(b, reason) {
    const total = DB.amountOf(b), prev = addDays(b.date, -1), today = DB.clock(), h = new Date().getHours();
    let rate = 100;
    if (reason === 'rain') rate = 0; else if (today < prev) rate = 0; else if (today === prev) rate = h < 12 ? 0 : h < 17 ? 50 : 100;
    const fee = Math.round(total * rate / 100), paid = b.paid ? (b.paidAmount || total) : 0;
    const refund = Math.max(0, paid - fee), billed = Math.max(0, fee - paid);
    const yen = (n) => '¥' + n.toLocaleString();
    const lines = reason === 'rain' ? 'キャンセル料：かかりません' + (paid ? '\nご返金額：' + yen(paid) + '（返金の方法は、あらためてご連絡します）' : '')
      : 'キャンセル料：' + rate + '%（' + yen(fee) + '）' + (refund ? '\nご返金額：' + yen(refund) + '（返金の方法は、あらためてご連絡します）' : '') + (billed ? '\nお支払いいただくキャンセル料：' + yen(billed) + '（お振込先は、あらためてご案内します）' : '');
    return { rate, fee, refund, billed, lines, paid };
  }
  function cancelModal(b, reason) {
    const c = cancelCalc(b, reason);
    openModal('キャンセル｜' + b.name + ' 様', '<div class="va-form">' +
      '<div class="va-field"><span>理由</span><div class="va-kinds">' + [['guest', 'お客様のご都合'], ['rain', '雨天・天候による中止']].map(([k, l]) => '<button type="button" class="va-pick' + (k === reason ? ' on' : '') + '" data-act="bk-cancel-reason" data-v="' + k + '" data-id="' + b.id + '" aria-pressed="' + (k === reason) + '">' + l + '</button>').join('') + '</div></div>' +
      '<div class="va-cxl"><p><b>' + esc(b.product) + '</b>　' + jpDate(b.date) + ' ' + b.time + '・' + b.people + '名（料金 ¥' + DB.amountOf(b).toLocaleString() + '）</p>' +
      '<p class="va-cxl-fee">' + esc(c.lines).replace(/\n/g, '<br>') + '</p>' +
      '<p class="va-info">キャンセルポリシー：体験日前日の正午まで 0%／前日の正午〜17:00 50%／前日17:00以降 100%。' + (reason === 'rain' ? '天候による中止は、キャンセル料はかかりません。' : '') + '</p></div>' +
      '<p class="va-info">キャンセルにすると、この予約の自動メール（リマインドなど）はすべて止まります。' + (b.email ? 'お客様には「' + (reason === 'rain' ? '雨天中止のお知らせ' : 'キャンセルのお知らせ') + '」が自動で送られます。' : 'メールアドレスがないため、お電話でお伝えください。') + '</p></div>',
      '<button type="button" class="va-btn" data-act="detail" data-id="' + b.id + '">戻る</button><button type="button" class="va-btn va-btn-danger" data-act="bk-cancel-yes" data-v="' + reason + '" data-id="' + b.id + '">' + (reason === 'rain' ? '雨天中止にする' : 'キャンセルにする') + '</button>');
  }
  // 期限を過ぎても回答・入金がない予約（電話で確認する）
  function lateItems() {
    const out = [], clock = DB.clock();
    D().bookings.forEach((b) => {
      if (b.cancelled || b.status !== 'ok' || !b.confirmedOn || b.date < clock) return; // 体験日を過ぎた予約は出さない
      const dl = DB.deadlines(b), f = b.follow || {};
      if (!b.allergy && dl.allergy < clock && !f.allergy) out.push({ b, kind: 'allergy', text: 'アレルギーの回答が期限（' + sd(dl.allergy) + '）を過ぎています' });
      if (DB.isPay(b) && !b.paid && !b.payReported && dl.pay < clock && !f.pay) out.push({ b, kind: 'pay', text: 'お振込が期限（' + sd(dl.pay) + '）を過ぎています' });
    });
    return out;
  }

  // ---------- 予約の詳細：いまやること（一番上に出す） ----------
  function nextActions(b) {
    if (b.cancelled) return [];
    const out = [], rq = b.innReq && b.innReq.venue === b.venue ? b.innReq : null, btn = (act, label, extra) => '<button type="button" class="va-btn va-btn-primary va-btn-sm" data-act="' + act + '" data-id="' + b.id + '"' + (extra || '') + '>' + label + '</button>';
    if (b.status === 'wait' && isKyokai()) {
      if (!b.venue) out.push({ t: '会場（民宿）を選んでください', b: venueSelect(b) });
      else if (!rq) out.push({ t: b.venue + ' に受け入れを依頼してください', b: btn('inn-req', '民宿に受け入れを依頼') });
      else if (rq.state === 'asked') {
        const byMail = MAILER() && MAILER().ready() && (b.innLog || []).some((l) => l.kind === 'request' && l.inn === b.venue && l.how === 'メール');
        out.push(byMail
          ? { t: b.venue + ' の返事を待っています', h: '民宿がメールの「受け入れる」を押すと、自動で「受け入れOK」になります（15秒ほどで反映）。電話で返事をもらった場合だけ、右下の「電話でOKをもらった」を押してください。', b: '<span class="va-next-btns"><button type="button" class="va-btn va-btn-sm" data-act="inn-pull">今すぐ確認</button><button type="button" class="va-linkbtn" data-act="inn-req-ans" data-v="ok" data-id="' + b.id + '">電話でOKをもらった</button></span>' }
          : { t: b.venue + ' の返事を待っています', h: 'この民宿にはメールが届かないので、電話で受け入れを確認してください。', b: '<button type="button" class="va-btn va-btn-sm" data-act="inn-req-ans" data-v="ok" data-id="' + b.id + '">電話でOKをもらった</button>' });
      }
      else if (rq.state === 'ok') out.push({ t: b.venue + ' が受け入れOKです。予約を確定してください', b: btn('accept', '予約を確定する') });
      else out.push({ t: b.venue + ' は受け入れできません。別の民宿を選んでください' });
      return out;
    }
    if (b.status !== 'ok') return out;
    if (b.innPending) out.push({ t: (b.venue || '民宿') + ' へ電話で伝える変更があります', b: btn('inn-told', '電話で伝えた') });
    if (!b.venue) out.push({ t: '会場（民宿）を決めてください', h: '決めると、お客様と民宿に自動で知らせます。', b: venueSelect(b) });
    lateItems().filter((x) => x.b.id === b.id).forEach((x) => out.push({ t: x.text, b: '<button type="button" class="va-btn va-btn-primary va-btn-sm" data-act="follow" data-v="' + x.kind + '" data-id="' + b.id + '">電話した内容を記録</button>' }));
    if (b.payReported && !b.paid) out.push({ t: 'お客様から振込のご報告があります。入金を確認してください', b: btn('paid', '入金を確認した') });
    // 体験日を過ぎても受付の記録がない
    if (!b.attend && b.date < DB.clock()) out.push({ t: '当日の受付の記録がありません。来場したかどうかを記録してください', h: '「来なかった」と記録すると、体験料金が未入金の場合は、キャンセル料のお支払いのお願いが自動で送られます。', b: '<span class="va-next-btns"><button type="button" class="va-btn va-btn-sm" data-act="attend-rec" data-v="ok" data-id="' + b.id + '">来場した</button><button type="button" class="va-btn va-btn-sm" data-act="attend-rec" data-v="no" data-id="' + b.id + '">来なかった</button></span>' });
    const nf = DB.noShowFee(b);
    if (nf && nf.need && !b.feePaid) out.push({ t: 'ご来場がなかったため、キャンセル料 ¥' + nf.amount.toLocaleString() + ' の入金待ち（期限 ' + sd(nf.due) + '）', h: 'お客様には、キャンセル料のお支払いのお願いを自動で送っています。', b: '<span class="va-next-btns"><button type="button" class="va-btn va-btn-sm va-btn-primary" data-act="fee-paid" data-id="' + b.id + '">キャンセル料の入金を確認した</button><button type="button" class="va-linkbtn" data-act="fee-waive" data-id="' + b.id + '">キャンセル料を請求しない</button></span>' });
    if (b.payAdjust) out.push({ t: '人数変更による差額（' + (b.payAdjust > 0 ? '追加' : '返金') + ' ¥' + Math.abs(b.payAdjust).toLocaleString() + '）の精算', b: btn('pay-adjust-done', '精算した') });
    if (b.allergy && b.allergy.count && (b.allergy.people || []).some((p) => !(p.howTo || '').trim())) out.push({ t: (b.venue || '民宿') + ' のアレルギー対応がまだです（期限 ' + sd(DB.innDeadline(b)) + '）', b: '<button type="button" class="va-btn va-btn-sm" data-act="allergy-inn" data-id="' + b.id + '">民宿の対応を記入</button>' });
    return out;
  }

  // ---------- メールが送られる操作は、押す前に「誰に・何が届くか」を見せて確かめる ----------
  function mailConfirmText(a, b, v) {
    if (!b) return '';
    const who = (b.group && b.group !== '個人' ? b.group + ' ' : '') + b.name + ' 様';
    const inn = (n) => { const x = DB.innOf(n) || {}; return x.contact === 'mail' && x.email; };
    const L = [];
    const cust = (t) => { if (b.email) L.push('・お客様（' + who + '）：' + t); };
    const toInn = (n, t) => { if (n && inn(n)) L.push('・' + n + '：' + t); else if (n) L.push('・' + n + '：（メールが届かない民宿なので、電話で伝える）'); };
    if (a === 'accept') { cust('「ご予約が確定しました」「食物アレルギー確認のお願い」「お支払いのご案内」の3通'); toInn(b.venue, '「受け入れ確定のご連絡」'); }
    else if (a === 'inn-req') toInn(b.venue, '「受け入れのご依頼」（受け入れるボタンつき）');
    else if (a === 'bk-change-save') { cust('「予約内容変更のお知らせ」'); toInn(b.venue, '「予約内容変更のご連絡」'); }
    else if (a === 'bk-cancel-yes') { cust(v === 'rain' ? '「雨天中止のお知らせ」' : '「キャンセルのお知らせ」'); toInn(b.venue, '「キャンセルのご連絡」'); }
    else if (a === 'decline-yes') cust('「お断りのご連絡」');
    else if (a === 'paid') cust('「ご入金確認のお知らせ」');
    else if (a === 'fee-paid') cust('「キャンセル料のご入金確認」');
    else if (a === 'inn-resend') toInn(b.venue, '最新の内容のご連絡');
    else if (a === 'attend-rec' && v === 'no' && !b.paid) cust('「キャンセル料のお支払いのお願い」（請求書つき）');
    else return '';
    if (!L.length) return '';
    return 'この操作をすると、次のメールが届きます。\n\n' + L.join('\n') + '\n\n送ったメールは取り消せません。よろしいですか？';
  }

  // 受け入れ人数・同じ時間帯の重なり・できる体験のチェック
  function capWarn(b, venue) {
    const vn = venue || b.venue; if (!vn) return [];
    const inn = DB.innOf(vn) || {}, out = [];
    const t = (x) => { const m = String(x || '0:0').split(':'); return Number(m[0]) * 60 + Number(m[1] || 0); };
    const same = D().bookings.filter((x) => x.id !== b.id && !x.cancelled && x.venue === vn && x.date === b.date && Math.abs(t(x.time) - t(b.time)) < 120);
    const total = same.reduce((a, x) => a + x.people, b.people);
    if (same.length) out.push('同じ時間帯に、この民宿で別の予約が' + same.length + '件あります（' + same.map((x) => x.time + ' ' + x.name + ' 様 ' + x.people + '名').join('、') + '）');
    if (inn.cap && total > inn.cap) out.push('受け入れ人数の上限（' + inn.cap + '名）を超えます（合計 ' + total + '名）');
    if (inn.exps && inn.exps.length && inn.exps.indexOf(b.product) < 0) out.push('この民宿は「' + b.product + '」を受け付けていません');
    return out;
  }

    // 共有

      (warns.length ? '<p class="va-warn">' + ic('alert') + '<span>' + warns.map(esc).join('<br>') + '</span></p>' : '') +
      '<ul class="va-inn-st">' + items.join('') + '</ul>' +
      (log ? '<details class="va-inn-log"><summary>民宿への連絡の記録</summary><ul>' + log + '</ul></details>' : '') +
      '<div class="va-inn-b"><a class="va-file" href="' + esc(DB.innLink(b)) + '" target="_blank" rel="noopener">' + ic('home') + '民宿用ページ（民宿が見る画面）</a>' +
      (b.status === 'ok' ? '<button type="button" class="va-file" data-act="inn-resend" data-id="' + b.id + '">' + ic('send') + '民宿へ最新の内容を送る</button>' : '') + '</div></div>';
  }

  // ---------- 取り込み（本物のサイトの申込フォームから書き出したCSV/Excel） ----------
  // 項目：[キー, 表示名, 必須, 列名の候補]
  const IMP_FIELDS = [
    ['created', '申込日時（送信日時）', false, ['申込日時', '送信日時', '受付日時', '登録日時', '日時', 'date', '投稿日時']],

    ['payment', 'お支払方法', true, ['お支払方法', '支払方法', '支払い方法', 'お支払い方法']],

    ['pref', '都道府県', false, ['都道府県']],
    ['addr', 'ご住所', false, ['ご住所', '住所']],
    ['phone', '電話番号', true, ['電話番号', '電話', 'tel', 'TEL']],

    ['note', 'その他・ご質問等', false, ['その他・ご質問等', 'その他', 'ご質問', '備考', '連絡事項']]
  ];
  const IMP_MAP_KEY = 'oshino-import-map-v1';
  const impMapLoad = () => { try { return JSON.parse(localStorage.getItem(IMP_MAP_KEY) || 'null'); } catch (e) { return null; } };

  // 見本（仮のファイル）。本物の書き出しファイルが届いたら、列の名前を合わせ直す
  const IMP_SAMPLE_HEAD = ['申込日時', '申込体験', '申込者名', '団体名', '希望日', '開始時間（時）', '開始時間（分）', '申込人数', '班編成（5人）', '班編成（6人）', 'お支払方法', '郵便番号', '都道府県', 'ご住所', '電話番号', 'メールアドレス', 'メールアドレス確認', 'その他・ご質問等', 'キャンセル料について'];

    ['2026/10/20 10:12', 'ほうとう作り体験', '山田 太郎', '株式会社サンプル商事', '2026/11/21', '10時', '00分', '10', '2班', '0班', '振込', '401-0511', '山梨県', '南都留郡忍野村忍草1-2-3', '090-1234-5678', 'n.ohmae+guest1@aiinnovation.jp', 'n.ohmae+guest1@aiinnovation.jp', '社員研修で伺います。', '確認済'],

  ];
  function impSampleCsv() {
    const q = (v) => '"' + String(v).replace(/"/g, '""') + '"';
    return '\ufeff' + [IMP_SAMPLE_HEAD].concat(IMP_SAMPLE_ROWS).map((r) => r.map(q).join(',')).join('\r\n');
  }
  function csvParse(text) {
    const rows = []; let row = [], cur = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
      else if (c === '"') q = true;
      else if (c === ',') { row.push(cur); cur = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
      else cur += c;
    }
    if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
    return rows.filter((r) => r.some((x) => String(x).trim() !== ''));
  }
  function impAutoMap(headers) {
    const saved = impMapLoad(), map = {};
    IMP_FIELDS.forEach(([k, , , cands]) => {
      if (saved && saved[k] && headers.indexOf(saved[k]) >= 0) { map[k] = saved[k]; return; }
      const norm = (x) => String(x).replace(/[\s　]/g, '').toLowerCase();
      const hit = headers.find((h) => cands.some((c) => norm(h) === norm(c))) || headers.find((h) => cands.some((c) => norm(c).length >= 2 && norm(h).indexOf(norm(c)) >= 0 && !/確認/.test(h)));
      map[k] = hit || '';
    });
    // 「開始時間」が1列だけのとき、「分」の列は使わない
    if (map.minute === map.time) map.minute = '';
    return map;
  }
  const z2 = (n) => String(n).padStart(2, '0');
  function impNormDate(v) {
    const s = String(v || '').trim(); let m;
    if ((m = s.match(/(\d{4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/))) return m[1] + '-' + z2(m[2]) + '-' + z2(m[3]);
    if (/^\d{5}$/.test(s)) { const d = new Date(Date.UTC(1899, 11, 30) + Number(s) * 86400000); return d.getUTCFullYear() + '-' + z2(d.getUTCMonth() + 1) + '-' + z2(d.getUTCDate()); }
    return '';
  }
  function impNormTime(h, mi) {
    const s = String(h || '').trim(); let m;
    if ((m = s.match(/(\d{1,2})\s*[:：時]\s*(\d{1,2})?/))) { const mm = m[2] != null ? m[2] : String(mi || '').replace(/\D/g, '') || '0'; return z2(m[1]) + ':' + z2(mm); }
    if (/^\d{1,2}$/.test(s)) return z2(s) + ':' + z2(String(mi || '').replace(/\D/g, '') || '0');
    return '';
  }
  function impRows() {
    const im = S.imp; if (!im || !im.rows) return [];
    const col = (k) => im.headers.indexOf(im.map[k]);
    const get = (r, k) => { const i = col(k); return i >= 0 ? String(r[i] == null ? '' : r[i]).trim() : ''; };
    const existing = D().bookings;
    const seen = {};
    return im.rows.map((r, n) => {
      const o = {
        created: get(r, 'created'), productRaw: get(r, 'product'), name: get(r, 'name'), group: get(r, 'group'),
        date: impNormDate(get(r, 'date')), dateRaw: get(r, 'date'), time: impNormTime(get(r, 'time'), get(r, 'minute')), people: Number(get(r, 'people').replace(/[^\d]/g, '')) || 0,
        team5: Number(get(r, 'team5').replace(/[^\d]/g, '')) || 0, team6: Number(get(r, 'team6').replace(/[^\d]/g, '')) || 0,
        paymentRaw: get(r, 'payment'), zip: get(r, 'zip'), pref: get(r, 'pref'), addr: get(r, 'addr'), phone: get(r, 'phone'), email: get(r, 'email'), note: get(r, 'note')
      };
      o.product = PRODUCTS.find((p) => o.productRaw.replace(/体験$/, '').indexOf(p) >= 0) || '';
      o.payment = /振/.test(o.paymentRaw) ? '振込' : /現金/.test(o.paymentRaw) ? '現金' : '';
      const err = [], warn = [];
      if (!o.product) err.push('申込体験がわかりません（' + (o.productRaw || '空欄') + '）');
      if (!o.name) err.push('申込者名が空欄');

      if (!o.time) err.push('開始時間がわかりません');

  function impReadFile(file) {
    const name = file.name, isX = /\.xlsx?$/i.test(name);
    const done = (rows) => {
      if (!rows.length) { toast('ファイルの中身が読み取れませんでした'); return; }
      const headers = rows[0].map((h) => String(h).trim());
      S.imp = { fileName: name, headers, rows: rows.slice(1), map: impAutoMap(headers), sel: {} };
      render();
    };
    if (isX) {
      const go = () => { const fr = new FileReader(); fr.onload = () => { try { const wb = XLSX.read(new Uint8Array(fr.result), { type: 'array' }); const ws = wb.Sheets[wb.SheetNames[0]]; done(XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' })); } catch (e) { toast('Excelのファイルを読み取れませんでした'); } }; fr.readAsArrayBuffer(file); };
      if (window.XLSX) go(); else { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; sc.onload = go; sc.onerror = () => toast('Excelを読むための部品を読み込めませんでした。インターネットの接続を確認するか、CSVで保存し直してください'); document.head.appendChild(sc); }
    } else {
      const fr = new FileReader();
      fr.onload = () => {
        const buf = new Uint8Array(fr.result);
        let text = new TextDecoder('utf-8').decode(buf);
        if (text.indexOf('\ufffd') >= 0) { try { text = new TextDecoder('shift_jis').decode(buf); } catch (e) {} }
        done(csvParse(text.replace(/^\ufeff/, '')));
      };
      fr.readAsArrayBuffer(file);
    }
  }

  function exportTesterFile(email, name) {
    const c = MAILER().get();
    const doc = document.documentElement.cloneNode(true);
    // 開いている画面の状態を取り除き、最初の状態に戻す
    doc.querySelectorAll('#village-admin, #oshino-allergy, #oshino-inn, .mpp-ov, .__hl, [data-runtime]').forEach((x) => x.remove());
    const body = doc.querySelector('body'), root = doc.querySelector('#root');
    if (root) { root.innerHTML = ''; root.removeAttribute('hidden'); }
    [...body.children].forEach((x) => { if (x.tagName !== 'SCRIPT' && !x.matches('#root, .rv-bar')) x.remove(); });
    doc.querySelectorAll('script[data-oshino-preset]').forEach((x) => x.remove());
    const pre = doc.ownerDocument.createElement('script');
    pre.setAttribute('data-oshino-preset', '');
    pre.textContent = 'window.__OSHINO_PRESET=' + JSON.stringify({ id: 'p' + Date.now(), url: c.url, token: c.token, testTo: email }) + ';window.__OSHINO_TESTER=' + JSON.stringify({ email, name: name || '' }) + ';';
    const head = doc.querySelector('head'); head.insertBefore(pre, head.firstChild);
    const html = '<!DOCTYPE html>\n' + doc.outerHTML;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
    a.download = '忍野村予約モック_テスト用_' + (name || email.split('@')[0]) + '.html';
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  function caseCard(c) {
    const items = c.items.map((it) => itemRef(it)).filter(Boolean);
