    const nextBlocked = c.stage + 1 === 3 && !allOk;
    const steps = '<ol class="va-stage">' + STAGES.map((s, i) => '<li class="' + (i < c.stage ? 'done' : i === c.stage ? 'on' : '') + '"><span>' + (i < c.stage ? ic('check') : i + 1) + '</span>' + s + '</li>').join('') + '</ol>';
    return '<article class="va-card va-case" id="case-' + c.id + '"><div class="va-case-head"><div><p class="va-q-n">' + esc(c.id) + '・' + esc(c.kind) + '</p><h3 class="va-h3" style="margin:.1rem 0 0">' + esc(c.school) + '（' + esc(c.grade) + '・' + c.people + '名）</h3></div>' +
      '</div>' + steps +
      '<div class="va-case-body"><div class="va-card va-case-info">' + row('日程', jpDate(c.from) + ' 〜 ' + jpDate(c.to)) + row('人数', c.people + '名（' + c.breakdown + '）') + rowTel('担当教員', c.teacher + ' 先生', c.phone) +
      row('交通', c.bus) + row('メモ', c.memo || '—') + '</div>' +
      '<div><h4 class="va-h4">手配先</h4>' + items.map((x) => '<div class="va-alloc"><div><strong>' + esc(itemPlace(x)) + '</strong>' + warnLine(x) + '</div>' +
        chip(x.status) + '<div class="va-alloc-act">' + telBtn(placePhone(x), '電話する') + '</div></div>').join('') + '</div></div>' +
      '<div class="va-todo-actions">' + (c.stage > 0 ? '<button type="button" class="va-btn" data-act="case-prev" data-id="' + c.id + '">' + ic('left') + '前の段階に戻す</button>' : '') +
      (c.stage < 5 ? '<button type="button" class="va-btn va-btn-primary" data-act="case-next" data-id="' + c.id + '"' + (nextBlocked ? ' disabled' : '') + '>次へ：' + STAGES[c.stage + 1] + ic('right') + '</button>' : '') + '</div>' +
      (nextBlocked ? '<p class="va-note">全施設の受入確認後に「確定」へ進めます。</p>' : '') + '</article>';
  }

  // ---------- 画面：予約一覧（事業者）／全予約（観光協会） ----------
  function pageList() {
    const k = isKyokai();
    if (!k) S.listType = isStayFac() ? 'stay' : 'exp';
    const q = S.listQuery.trim().toLowerCase();
    const routeOk = (x) => S.listRoute === 'all' || x.route === S.listRoute;
    const typeTabs = '<div class="va-segs" role="group" aria-label="予約の種類">' + [['exp', '体験'], ['stay', '宿泊']].map(([v, l]) =>
      '<button type="button" class="va-seg' + (S.listType === v ? ' on' : '') + '" data-act="list-type" data-v="' + v + '" aria-pressed="' + (S.listType === v) + '">' + ic(v === 'exp' ? 'list' : 'home') + l + '</button>').join('') + '</div>';
    let all, cards, text;
    if (S.listType === 'stay') {
      all = stayList().filter((o) => routeOk(o.x));
      text = (o) => o.k === 'g' ? o.x.id + ' ' + o.x.org + ' ' + o.x.phone + ' ' + o.x.contact : o.x.id + ' ' + o.x.name + ' ' + o.x.phone;
    } else {
      all = V().bookings.slice().sort(byTime).map((b) => ({ k: 'b', x: b })).filter((o) => routeOk(o.x));
      text = (o) => o.x.id + ' ' + o.x.name + ' ' + o.x.phone + ' ' + o.x.product;
    }
    const counts = { all: all.length, wait: 0, ok: 0, done: 0 };
    all.forEach((o) => counts[o.x.status]++);
    const alOk = (o) => { if (S.listType === 'stay' || S.listAl === 'all') return true; const i = alInfo(o.x); if (!i) return false; return S.listAl === 'alt' ? i.key === 'yes' && i.alt > 0 : i.key === S.listAl; };
    const list = all.filter((o) => (S.listFilter === 'all' || o.x.status === S.listFilter) && alOk(o) && (!q || text(o).toLowerCase().includes(q)));
    const alCount = (v) => all.filter((o) => { const i = alInfo(o.x); return i && (v === 'alt' ? i.key === 'yes' && i.alt > 0 : i.key === v); }).length;
    const alSegs = S.listType === 'stay' ? '' : '<div class="va-segs" role="group" aria-label="アレルギーで絞り込み"><span class="va-segs-l">アレルギー</span>' + [['all', 'すべて'], ['yes', 'あり'], ['alt', '代替食が必要'], ['none', 'なし'], ['pending', '未回答']].map(([v, l]) =>
      '<button type="button" class="va-seg' + (S.listAl === v ? ' on' : '') + '" data-act="list-al" data-v="' + v + '" aria-pressed="' + (S.listAl === v) + '">' + l + (v === 'all' ? '' : ' <span>' + alCount(v) + '</span>') + '</button>').join('') + '</div>';
    cards = list.map((o) => o.k === 'b' ? bookingCard(o.x, { showDate: true }) : stayCardOf(o));
    const tabs = [['all', 'すべて'], ['wait', '返事待ち'], ['ok', '確定'], ['done', '完了']].map(([v, l]) =>
      '<button type="button" class="va-seg' + (S.listFilter === v ? ' on' : '') + '" data-act="filter" data-v="' + v + '" aria-pressed="' + (S.listFilter === v) + '">' + l + ' <span>' + counts[v] + '</span></button>').join('');
    const routes = '<div class="va-segs" role="group" aria-label="経路で絞り込み">' + [['all', 'すべて'], ['kyokai', '電話・窓口で受付'], ['direct', '予約サイトから']].map(([v, l]) =>
      '<button type="button" class="va-seg' + (S.listRoute === v ? ' on' : '') + '" data-act="list-route" data-v="' + v + '" aria-pressed="' + (S.listRoute === v) + '">' + l + '</button>').join('') + '</div>';
    return '<div class="va-intro"><h2 class="va-h2">' + (k ? '全予約' : '予約一覧') + '</h2></div>' +
      (k ? typeTabs : '') + '<label class="va-search">' + ic('search') + '<span class="va-sr">予約を検索</span><input type="search" data-bind="listQuery" value="' + esc(S.listQuery) + '" placeholder="氏名・団体名・電話番号・受付番号"></label>' +
      routes + '<div class="va-segs" role="group" aria-label="状態で絞り込み">' + tabs + '</div>' + alSegs +
      '<div class="va-stack">' + (cards.length ? cards.join('') : '<p class="va-empty">該当する予約はありません。</p>') + '</div>';
  }

  // ---------- 画面：電話 ----------
  // 観光協会と宿（事業者）が同じ内容を見ながら電話対応できるようにする。
  // ・「この日の予約」：経路（電話・窓口／予約サイト）を問わず、その日の予約を一覧
  // ・新規予約：サイトの予約画面と同じ項目＋電話ならではの項目（受付経路・受付者）
  // ・登録前の重複チェック → 登録後に確認メール
  const ROUTE_OPTS = [['direct', '予約サイトから'], ['kyokai', '電話・窓口で受付'], ['agency', '旅行会社から']];
  const TYPE_LABEL = { exp: '体験', stay: '宿泊', group: '団体宿泊' };
  const ARRIVALS = ['未定・相談したい', '14:00', '15:00', '16:00', '17:00', '18:00', '19:00', '20:00'];
  const pad = (n, w) => String(n).padStart(w, '0');
  const yymmdd = (iso) => iso.slice(2, 4) + iso.slice(5, 7) + iso.slice(8, 10);
  const typesFor = () => isKyokai() ? ['exp'] : isStayFac() ? ['stay', 'group'] : ['exp'];

  // 予約をひとつの形にそろえる（t: b=体験 / s=宿泊 / g=団体宿泊）
  function allItems(d) {
    return d.bookings.map((x) => ({ t: 'b', x, from: x.date, to: addDays(x.date, 1), stayId: null }))
      .concat(d.groups.map((x) => ({ t: 'g', x, from: x.from, to: x.to, stayId: x.stayId })))
      .concat(d.stays.map((x) => ({ t: 's', x, from: x.checkin, to: x.checkout, stayId: x.stayId })));
  }
  const findRef = (t, id) => (t === 'b' ? D().bookings : t === 'g' ? D().groups : D().stays).find((x) => x.id === id);
  const itemWho = (it) => it.t === 'g' ? it.x.org + '（代表 ' + it.x.contact + ' 様）' : it.x.name + ' 様';
  const itemWhere = (it) => it.t === 'b' ? it.x.product + '（' + DB.JIGYO.name + '）' : DB.stayInfo(it.stayId).name;
  const itemSpan = (it) => it.t === 'b' ? sd(it.x.date) + ' ' + it.x.time : sd(it.from) + '〜' + sd(it.to) + '（' + nights(it.from, it.to) + '泊）';
  const itemPeople = (it) => it.t === 'b' ? it.x.people + '名' : it.t === 'g' ? it.x.people + '名・' + (it.x.rooms || '—') + '室' : it.x.guests;
  const detailAct = (t) => t === 'b' ? 'detail' : t === 'g' ? 'g-detail' : 's-detail';
  const typeTag = (it) => '<span class="va-tag">' + (it.t === 'b' ? '体験' : it.t === 'g' ? '団体宿泊' : '宿泊') + '</span>';

  // ---------- 確認メール（送信状況は宿・観光協会で共有） ----------
  const TPL = DB.MAIL_TPL;
  const mailsOf = (id) => (D().mails || []).filter((m) => m.refId === id);
  const suggestTpl = (x) => x.cancelled ? 'declined' : x.status === 'wait' ? (x.route === 'kyokai' ? 'kyokai' : 'received') : 'confirmed';
  function mailBadge(x) {
    const need = suggestTpl(x);
    const hit = mailsOf(x.id).find((m) => m.tpl === need);
    if (hit) return '<span class="va-mail va-mail-ok">' + ic('mail') + '送信済み：' + esc(TPL[need].label) + '（' + esc(hit.at) + '・' + esc(hit.by) + '）</span>';
    if (!x.email) return '<span class="va-mail va-mail-no">' + ic('mail') + 'メールアドレス未確認</span>';
    return '<span class="va-mail va-mail-no">' + ic('mail') + '未送信：' + esc(TPL[need].label) + '</span>';
  }
  function mailSection(t, x) {
    const ms = mailsOf(x.id);
    return '<div class="va-mailbox"><h4 class="va-h4">' + ic('mail') + '確認メール</h4><p>' + mailBadge(x) + '</p>' +
      (ms.length ? '<ul class="va-mailhist">' + ms.map((m) => '<li><b>' + esc(m.at) + '</b>　' + esc(m.label) + sendBadge(m) + '<span>' + esc(m.by) + ' → ' + esc(m.to || '（宛先なし）') + '</span>' + (t === 'b' && m.files && m.files.length ? '<span class="va-files">' + fileBtns(m.files, x) + '</span>' : '') + '</li>').join('') + '</ul>' : '<p class="va-empty">まだ送信していません。</p>') +
      '<button type="button" class="va-btn" data-act="mail-open" data-t="' + t + '" data-id="' + x.id + '">' + ic('mail') + 'メールを作成する</button></div>';
  }
  const senderName = () => isKyokai() ? '観光協会 ' + STAFF() : FAC().name;
  function mailOpen(t, id, tpl) {
    const x = findRef(t, id); if (!x) return;
    const k = tpl || suggestTpl(x);
    const m = DB.buildMail(k, t, x);
    S.mail = { t, id, tpl: k };
    openModal('確認メールを送る', '<div class="va-form">' +
      '<div class="va-field"><span>テンプレート</span><div class="va-kinds">' + Object.keys(TPL).map((v) => '<button type="button" class="va-pick' + (v === k ? ' on' : '') + '" data-act="mail-tpl" data-v="' + v + '" aria-pressed="' + (v === k) + '">' + esc(TPL[v].label) + (v === suggestTpl(x) ? '<small class="va-rec">おすすめ</small>' : '') + '</button>').join('') + '</div>' +
      '<small class="va-fhint">予約の状態に合わせて「おすすめ」を選んでいます。テンプレートを変えると本文も入れ替わります。</small></div>' +
      '<label class="va-field"><span>宛先</span><input type="email" id="va-mail-to" value="' + esc(m.to) + '" placeholder="メールアドレス"></label>' +
      (m.to ? '' : '<p class="va-warn">' + ic('alert') + '<span>メールアドレスが未確認です。お客様に確認して入力してください。</span></p>') +
      '<label class="va-field"><span>件名</span><input type="text" id="va-mail-subject" value="' + esc(m.subject) + '"></label>' +
      '<label class="va-field"><span>本文（予約の入力内容が入っています。必要なら手直しできます）</span><textarea id="va-mail-body" rows="16" class="va-mailbody">' + esc(m.body) + '</textarea></label></div>' +
      '<p class="va-note">' + (MAILER() && MAILER().ready() ? 'Gmailから実際に送ります' + (MAILER().get().testMode ? '（テストモード：' + esc(MAILER().get().testTo) + ' に届きます）' : '（本番：上の宛先に届きます）') : 'GASの設定がまだのため、送信されません（「自動メール」→「実際のメール送信」で設定できます）') + '。</p>',
      '<button type="button" class="va-btn" data-act="modal-close">キャンセル</button><button type="button" class="va-btn va-btn-primary" data-act="mail-send">' + ic('mail') + '送信する（' + esc(senderName()) + '）</button>');
  }

  // ---------- この日の予約（電話中に見る一覧） ----------
  function dayItems(from, to, place) {
    return allItems(V()).filter((it) => !it.x.cancelled && it.from < to && from < it.to &&
      (!place || (place === 'exp' ? it.t === 'b' : it.stayId === place)))
      .sort((a, b) => (a.from + (a.x.time || '')).localeCompare(b.from + (b.x.time || '')));
  }
  function dayRow(it) {
    return '<button type="button" class="va-dp-row" data-act="' + detailAct(it.t) + '" data-id="' + it.x.id + '">' +
      '<span class="va-dp-when">' + esc(itemSpan(it)) + '</span>' +
      '<span class="va-dp-main"><strong>' + esc(itemWho(it)) + '</strong><span class="va-dp-meta">' + esc(itemWhere(it)) + '・<b>' + esc(itemPeople(it)) + '</b></span>' +
      '<span class="va-dp-tags">' + typeTag(it) + routeTag(it.x) + chip(it.x.status) + mailBadge(it.x) + '</span></span>' + ic('right', 'va-sched-arrow') + '</button>';
  }
  function dayPanel(from, to, place, title) {
    const list = dayItems(from, to, place);
    const left = place && place !== 'exp' ? '<span class="va-dp-left">残り ' + roomsLeft({ stayId: place, from, to }) + '室／全' + (DB.ROOMS[place] || '—') + '室</span>' : '';
    return '<section class="va-daypanel" aria-live="polite"><div class="va-dp-head"><h3 class="va-h3">' + ic('cal') + esc(title) + '</h3>' + left + '</div>' +
      (list.length ? list.map(dayRow).join('') : '<p class="va-empty">この日程の予約はありません。</p>') +
      '<p class="va-fhint">予約サイト・電話や窓口・旅行会社から受けた予約をまとめて表示しています。</p></section>';
  }
  const placeOpts = () => (isKyokai() ? [['', 'すべて']] : []).concat(isKyokai() || isStayFac() ? DB.FACILITIES.filter((f) => f.type === 'stay' && (isKyokai() || f.id === S.facility)).map((f) => [f.id, f.name]) : []).concat(isKyokai() || !isStayFac() ? [['exp', '体験（' + DB.JIGYO.name + '）']] : []);

  function pagePhone() {
    if (S.phoneMode === 'new') return phoneWizard();
    if (S.phoneMode === 'find') return phoneFind();
    if (S.phPlace == null || !placeOpts().some((o) => o[0] === S.phPlace)) S.phPlace = placeOpts()[0][0];
    return '<div class="va-intro"><h2 class="va-h2">電話対応</h2><p class="va-p">電話を受けたら、まず「この日の予約」で同じ団体・お客様の予約がないか確認してください。</p></div>' +
      '<div class="va-bigchoice">' +
      '<button type="button" class="va-choice" data-act="phone-new">' + ic('plus') + '<strong>新規予約の受付</strong><span>サイトと同じ項目で登録・重複チェックあり</span></button>' +
      '<button type="button" class="va-choice" data-act="phone-find">' + ic('search') + '<strong>予約者からの電話</strong><span>検索して対応内容を記録・メール送信</span></button></div>' +
      '<div class="va-dp-ctrl"><label class="va-field"><span>日付</span><input type="date" data-bind="phDate" value="' + esc(S.phDate) + '"></label>' +
      '<label class="va-field"><span>施設</span><select data-bind="phPlace">' + placeOpts().map(([v, l]) => '<option value="' + v + '"' + (v === S.phPlace ? ' selected' : '') + '>' + esc(l) + '</option>').join('') + '</select></label></div>' +
      dayPanel(S.phDate, addDays(S.phDate, 1), S.phPlace, jpDate(S.phDate) + 'の予約');
  }

  const slotState = (date, time, product) => {
    if (date < addDays(TODAY, 7)) return 'none'; // サイトと同じ：実施日の1週間前まで
    if ((time === '09:00' || time === '09:30') && product === 'よもぎ団子作り') return 'none';
    if (V().bookings.some((b) => !b.cancelled && b.date === date && b.time === time && b.product === product)) return 'busy';
    return 'free';
  };

  // ---------- 入力項目（サイトの予約画面と同じ項目・並び） ----------
  const F = (k, label, type, o) => Object.assign({ k, label, type }, o || {});
  const isSchool = (w) => w.f.usage === '学校・団体';
  const EMAIL_FIELDS = [
    F('email', 'メールアドレス', 'email', { ph: '例：taro@example.jp' }),
    F('email2', 'メールアドレス確認', 'email', { ph: 'もう一度入力してください', show: (w) => !w.f.emailNg }),
    F('emailNg', '電話口で確認できなかった（あとで確認する）', 'check')
  ];
  const PHONE_SEC = ['電話の受付', [
    F('route', '受付経路', 'pick', { opts: ROUTE_OPTS, show: () => !isKyokai() }),
    F('taker', '受付者', 'text', { req: 1, ph: '電話を受けた人の名前' })
  ]];
  // 体験（サイト：BookingFlow と同じ）
  const EXP_SECS = [
    ['申込者', [
      F('name', '申込者名', 'text', { req: 1, ph: '代表者の氏名' }),
      F('usage', '利用区分', 'pick', { opts: ['個人', '学校・団体'] }),
      F('org', '団体名・学校名', 'text', { ph: '個人の場合は「個人」', show: isSchool }),
      F('school', '学校名', 'text', { ph: '例：忍野中学校', show: isSchool }),
      F('grade', '学年・学級', 'text', { ph: '例：2年生 4クラス', show: isSchool }),
      F('teachers', '引率教員数', 'number', { ph: '例：8', show: isSchool }),
      F('students', '生徒数', 'number', { ph: '例：120', show: isSchool }),
      F('teacher', '担当教員名', 'text', { ph: '代表の先生', show: isSchool }),
      F('agency', '旅行会社経由', 'pick', { opts: ['なし', 'あり・会社名はその他へ記入'] })
    ]],
    ['人数・お支払', [
      F('people', '申込人数', 'number', { req: 1, min: 5, max: 300, hint: '5名〜300名。300名を超える場合はご相談ください' }),
      F('teams', '班編成', 'text', { ph: '例：6人班×20班' }),
      F('payment', 'お支払方法', 'pick', { opts: ['現金', '振込（振込手数料は申込者負担）', '旅行会社経由で精算'] }),
      F('invoice', '見積書・請求書の発行を希望する', 'check')
    ]],
    ['住所・連絡先', [
      F('country', '国・地域', 'pick', { opts: ['日本', '海外（国名をその他へ記入）'] }),
      F('zip', '郵便番号（任意）', 'text', { ph: '海外の場合は空欄可' }),
      F('pref', '都道府県（任意）', 'text', { ph: '海外の場合は国・地域名' }),
      F('address', '住所', 'text', { ph: '市区町村・番地・建物名' }),
      F('phone', '電話番号', 'tel', { req: 1, ph: '例：090-1234-5678' })
    ].concat(EMAIL_FIELDS)],
    ['学校・団体向け追加情報', [
      F('allergy', 'アレルギーのある人数', 'number', { ph: '例：2' }),
      F('buses', 'バス台数', 'number', { ph: '例：3' }),
      F('diet', '食事制限', 'text', { ph: 'ベジタリアン、ハラール、アレルギー等' })
    ], isSchool],
    ['その他', [
      F('note', 'その他・ご質問等', 'textarea', { ph: '会場、バス、外国語対応など' }),
      F('agree', 'キャンセルポリシーを電話で説明し、同意をいただいた', 'check', { req: 1, hint: '前日の正午まで：0%／前日の正午〜17:00：50%／前日17:00以降：100%' })
    ]]
  ];
  // 宿泊（サイト：StayBooking と同じ）
  const STAY_SEC0 = [['宿泊日と宿泊者', [
    F('stayId', '宿泊施設', 'select', { opts: () => DB.FACILITIES.filter((f) => f.type === 'stay').map((f) => [f.id, f.name]), show: () => isKyokai() }),
    F('checkin', 'チェックイン日', 'date', { req: 1, min: TODAY }),
    F('nights', '泊数', 'number', { req: 1, min: 1, max: 14 }),
    F('adults', '人数（大人）', 'number', { req: 1, min: 1, max: 20 }),
    F('rooms', '室数', 'number', { req: 1, min: 1, max: 10 })
  ]]];
  const STAY_SECS = [['代表者情報', [
    F('name', '代表者氏名', 'text', { req: 1 })
  ].concat(EMAIL_FIELDS, [
    F('phone', '電話番号', 'tel', { req: 1, ph: '例：090-1234-5678' }),
    F('arrival', '到着予定時刻', 'select', { opts: () => ARRIVALS.map((a) => [a, a]) }),

        d.stays.push(Object.assign({}, common, { id: w.savedId, stayId: r.place, checkin: r.from, checkout: r.to, guests: '大人' + f.adults + '名・' + f.rooms + '室', rooms: num(f.rooms), kind: '個人・グループ', name: f.name.trim(), arrival: f.arrival, note: f.note || '', status: 'ok', unseen: isKyokai() }));
      } else {

  function phoneFind() {

    const res = allItems(V()).filter((it) => !q || text(it).includes(q)).sort((a, b) => a.from.localeCompare(b.from));

      '<div class="va-stack">' + (res.length ? res.map((it) => '<button type="button" class="va-pickrow' + (S.findSel === it.x.id ? ' on' : '') + '" data-act="find-sel" data-id="' + it.x.id + '"><div><strong>' + esc(itemWho(it)) + '</strong>' + chip(it.x.status) + routeTag(it.x) + '</div><span>' + typeTag(it) + ' ' + esc(itemWhere(it)) + '　' + esc(itemSpan(it)) + '・' + esc(itemPeople(it)) + '</span><span>' + esc(it.x.phone || '') + '</span></button>').join('') : '<p class="va-empty">該当する予約がありません。氏名・電話番号を再確認してください。</p>') + '</div>';
    const right = sel ? '<div class="va-card"><h3 class="va-h3">' + esc(itemWho(sel)) + 'の予約</h3><div class="va-detail-state">' + chip(sel.x.status) + routeTag(sel.x) + typeTag(sel) + '</div>' +
        rowTel('電話番号', itemWho(sel), sel.x.route === 'kyokai' ? KY.phone : sel.x.phone) + (sel.x.route === 'kyokai' ? '<p class="va-hint">観光協会からの予約です。お客様への連絡は観光協会（' + esc(STAFF()) + '）が窓口です。</p>' : '') +
        row('施設', itemWhere(sel)) + row('日程', itemSpan(sel)) + row('人数', itemPeople(sel)) + row('受付番号', sel.x.id) +
        '<button type="button" class="va-btn" data-act="' + detailAct(sel.t) + '" data-id="' + sel.x.id + '">くわしく見る</button></div>' +
        mailSection(sel.t, sel.x) +
        '<label class="va-field va-mt-s"><span>対応内容</span><textarea data-bind="callDraft" rows="4" placeholder="例：日程変更の希望あり。明日までに折り返し連絡。">' + esc(S.callDraft) + '</textarea></label>' +
        '<button type="button" class="va-btn va-btn-primary va-btn-lg" data-act="call-save"' + (S.callDraft.trim() ? '' : ' disabled') + '>' + ic('check') + '対応内容を記録</button>' +
        '<h4 class="va-h4">対応履歴（観光協会・宿で共有）</h4>' + (logs.length ? logs.map((l) => '<div class="va-log"><p>' + esc(l.content) + '</p><span>' + l.at + '・' + esc(l.staff) + '</span></div>').join('') : '<p class="va-empty">記録はまだありません。</p>')
      : '<div class="va-empty va-empty-box">' + ic('phone') + '<p>一覧から該当する予約を選択してください。</p></div>';
    return '<div class="va-intro"><button type="button" class="va-btn va-btn-ghost va-back" data-act="phone-menu">' + ic('left') + '電話メニューへ</button><h2 class="va-h2">予約者からの電話</h2></div>' +
      '<div class="va-two"><div>' + left + '</div><div>' + right + '</div></div>';
  }

  // ---------- 画面：予定表（Googleカレンダー風） ----------
  const CAL_COLORS = {
    'p:そば打ち': '#039be5', 'p:ほうとう作り': '#f4511e', 'p:よもぎ団子作り': '#0b8043',
    's:daikokuya': '#8e24aa', 's:masunoie': '#d81b60', 's:center-house': '#795548', 's:glamp-dome-fuji-oshino': '#3f51b5'
  };
  const STAY_SHORT = { 'daikokuya': '大黒家', 'masunoie': '鱒の家', 'center-house': 'センターハウス', 'glamp-dome-fuji-oshino': 'GLAMP DOME' };
  const calKey = (it) => it.t === 'k' ? 'k:' + it.kind : it.t === 'b' ? 'p:' + it.x.product : 's:' + it.stayId;
  CAL_COLORS['k:deadline'] = '#d93025'; CAL_COLORS['k:mail'] = '#5f6368';
  // 予約後の手続き（回答・振込の期限、自動メールの送信予定）を予定にする
  function taskItems() {
    const out = [], whoOf = (b) => (b.group && b.group !== '個人' ? b.group : b.name + ' 様');
    V().bookings.forEach((b) => {
      if (b.cancelled || b.status !== 'ok' || !b.confirmedOn || !b.email) return;
      const dl = DB.deadlines(b), add = (kind, date, label, done) => out.push({ t: 'k', kind, x: b, from: date, to: addDays(date, 1), stayId: null, label, done });
      add('deadline', dl.allergy, (b.allergy ? '✓ ' : '⏰ ') + 'アレルギー回答期限｜' + whoOf(b), !!b.allergy);
      if (DB.isPay(b)) add('deadline', dl.pay, (b.paid ? '✓ ' : '⏰ ') + '振込期限｜' + whoOf(b), !!b.paid);
      DB.autoPlan(b).forEach((pl) => { if (pl.state === 'planned' && pl.due) add('mail', pl.due, '✉ ' + pl.rule.label + '｜' + whoOf(b), false); });
    });
    return out;
  }
  const calColor = (it) => CAL_COLORS[calKey(it)] || '#5f6368';
  const calItems = (from, to) => allItems(V()).concat(taskItems()).filter((it) => !it.x.cancelled && it.from < to && from < it.to && !(S.calHide || {})[calKey(it)]);
  const dayDiff = (a, b) => Math.round((dateObj(b) - dateObj(a)) / 86400000);
  const tmin = (t) => { const m = String(t || '0:0').split(':'); return Number(m[0]) * 60 + Number(m[1] || 0); };
  const hm = (n) => String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(n % 60).padStart(2, '0');
  const stayShort = (id) => STAY_SHORT[id] || DB.stayInfo(id).name;
  const evTitle = (it) => it.t === 'k' ? it.label : it.t === 'b' ? it.x.product + '・' + it.x.name + ' 様（' + it.x.people + '名）'
    : stayShort(it.stayId) + '｜' + (it.t === 'g' ? it.x.org + '（' + it.x.people + '名）' : it.x.name + ' 様');
  const evCls = (it) => it.t === 'k' ? ' va-ev-task' + (it.done ? ' va-ev-done' : '') + (it.kind === 'mail' ? ' va-ev-mail' : '') : ' st-' + it.x.status + (it.x.status === 'wait' ? ' va-ev-tent' : '');
  const evAttr = (it) => ' data-act="' + (it.t === 'k' ? 'detail' : detailAct(it.t)) + '" data-id="' + esc(it.x.id) + '" style="--ev:' + calColor(it) + '" title="' + esc(evTitle(it) + (it.t === 'k' ? (it.done ? '（完了）' : '') : '・' + STATE[it.x.status].label)) + '"';

  // 週の中で、複数日にまたがる予定を段に並べる
  function laneLayout(items, ws, n) {
    const we = addDays(ws, n);
    const segs = items.map((it) => {
      const s = it.from < ws ? ws : it.from, e = it.to > we ? we : it.to, c0 = dayDiff(ws, s);
      return { it, c0, span: Math.max(1, dayDiff(s, e)), cl: it.from < ws, cr: it.to > we };
    }).sort((a, b) => (a.c0 - b.c0) || (b.span - a.span) || String(a.it.x.time || '').localeCompare(String(b.it.x.time || '')));
    const lanes = [];
    segs.forEach((sg) => {
      let L = 0;
      while (lanes[L] && lanes[L].slice(sg.c0, sg.c0 + sg.span).some(Boolean)) L++;
      lanes[L] = lanes[L] || Array(n).fill(false);
      for (let i = sg.c0; i < sg.c0 + sg.span; i++) lanes[L][i] = true;
      sg.L = L;
    });
    return { segs, lanes: lanes.length };
  }

  // 月表示
  function calMonth(d) {
    const first = d.slice(0, 8) + '01';
    const mon = dateObj(first).getMonth();
    const start = addDays(first, -dateObj(first).getDay()); // 日曜はじまり
    const dim = new Date(dateObj(first).getFullYear(), mon + 1, 0).getDate();
    const weeks = Math.ceil((dateObj(first).getDay() + dim) / 7);
    const MAXL = 3;
    let html = '<div class="va-gm"><div class="va-gm-head">' + WD.map((w, i) => '<div class="' + (i === 0 ? 'sun' : i === 6 ? 'sat' : '') + '">' + w + '</div>').join('') + '</div>';
    for (let w = 0; w < weeks; w++) {
      const ws = addDays(start, w * 7);
      const days = Array.from({ length: 7 }, (_, i) => addDays(ws, i));
      const { segs } = laneLayout(calItems(ws, addDays(ws, 7)), ws, 7);
      const more = Array(7).fill(0);
      const shown = segs.filter((sg) => {
        if (sg.L < MAXL) return true;
        for (let i = sg.c0; i < sg.c0 + sg.span; i++) more[i]++;
        return false;
      });
      html += '<div class="va-gm-week">' +
        '<div class="va-gm-bg">' + days.map((x) => '<button type="button" class="va-gm-cell' + (dateObj(x).getMonth() !== mon ? ' out' : '') + (x === d ? ' sel' : '') + '" data-act="cal-goday" data-v="' + x + '" aria-label="' + jpDate(x) + 'を日表示で開く"></button>').join('') + '</div>' +
        '<div class="va-gm-fg">' +
        days.map((x, i) => '<button type="button" class="va-gm-num' + (x === TODAY ? ' today' : '') + (dateObj(x).getMonth() !== mon ? ' out' : '') + '" style="grid-column:' + (i + 1) + ';grid-row:1" data-act="cal-goday" data-v="' + x + '">' + (dateObj(x).getDate() === 1 ? '<span class="va-gm-m">' + (dateObj(x).getMonth() + 1) + '月</span>' : '') + dateObj(x).getDate() + '</button>').join('') +
        shown.map((sg) => {
          const it = sg.it, pos = 'grid-column:' + (sg.c0 + 1) + ' / span ' + sg.span + ';grid-row:' + (sg.L + 2);
          if (it.t === 'b') return '<button type="button" class="va-ev va-ev-dotted' + evCls(it) + '"' + evAttr(it).replace('style="', 'style="' + pos + ';') + '><span class="va-ev-dot"></span><span class="va-ev-t">' + esc(it.x.time) + '</span><span class="va-ev-txt">' + ((() => { const i = alInfo(it.x); return i && i.key === 'yes' ? '⚠ ' : ''; })()) + esc(it.x.product) + '</span></button>';
          return '<button type="button" class="va-ev va-ev-bar' + evCls(it) + (sg.cl ? ' cl' : '') + (sg.cr ? ' cr' : '') + '"' + evAttr(it).replace('style="', 'style="' + pos + ';') + '><span class="va-ev-txt">' + esc(evTitle(it)) + '</span></button>';
        }).join('') +
        more.map((n, i) => n ? '<button type="button" class="va-gm-more" style="grid-column:' + (i + 1) + ';grid-row:' + (MAXL + 2) + '" data-act="cal-goday" data-v="' + days[i] + '">他 ' + n + ' 件</button>' : '').join('') +
        '</div></div>';
    }
    return html + '</div>';
  }

  // 週表示・日表示（時間軸）
  function calTime(days) {
    const H0 = 8, H1 = 19, PX = 52, n = days.length;
    const from = days[0], to = addDays(days[n - 1], 1);
    const items = calItems(from, to);
    const { segs, lanes } = laneLayout(items.filter((it) => it.t !== 'b'), from, n);
    const cols = 'grid-template-columns:3.6rem repeat(' + n + ',minmax(0,1fr))';
    const head = '<div class="va-gt-head" style="' + cols + '"><div></div>' + days.map((x) => {
      const dw = dateObj(x).getDay();
      return '<button type="button" class="va-gt-dh' + (x === TODAY ? ' today' : '') + (dw === 0 ? ' sun' : dw === 6 ? ' sat' : '') + '" data-act="cal-goday" data-v="' + x + '"><span>' + WD[dw] + '</span><b>' + dateObj(x).getDate() + '</b></button>';
    }).join('') + '</div>';
    const allday = '<div class="va-gt-all" style="' + cols + ';grid-template-rows:repeat(' + Math.max(1, lanes) + ',1.6rem)"><div class="va-gt-alllab" style="grid-row:1 / span ' + Math.max(1, lanes) + '">宿泊</div>' +
      (segs.length ? segs.map((sg) => '<button type="button" class="va-ev va-ev-bar' + evCls(sg.it) + (sg.cl ? ' cl' : '') + (sg.cr ? ' cr' : '') + '"' + evAttr(sg.it).replace('style="', 'style="grid-column:' + (sg.c0 + 2) + ' / span ' + sg.span + ';grid-row:' + (sg.L + 1) + ';') + '><span class="va-ev-txt">' + esc(evTitle(sg.it)) + '</span></button>').join('')
        : '<span class="va-gt-none" style="grid-column:2 / span ' + n + '">宿泊の予定なし</span>') + '</div>';
    const hours = Array.from({ length: H1 - H0 }, (_, i) => H0 + i);
    const colHtml = (x) => {
      const evs = items.filter((it) => it.t === 'b' && it.x.date === x).map((it) => ({ it, s: tmin(it.x.time), e: tmin(it.x.time) + 120 })).sort((a, b) => a.s - b.s);
      const out = []; let cl = [], end = -1;
      const flush = () => { const c = []; cl.forEach((ev) => { let k = 0; while (c[k] > ev.s) k++; c[k] = ev.e; ev.c = k; }); cl.forEach((ev) => { ev.n = c.length; out.push(ev); }); cl = []; };
      evs.forEach((ev) => { if (cl.length && ev.s >= end) { flush(); end = -1; } cl.push(ev); end = Math.max(end, ev.e); });
      if (cl.length) flush();
      return '<div class="va-gt-col' + (x === TODAY ? ' today' : '') + '" style="height:' + ((H1 - H0) * PX) + 'px">' + out.map((ev) => {
        const top = Math.max(0, (ev.s - H0 * 60) / 60 * PX), h = Math.max(22, (ev.e - ev.s) / 60 * PX - 2);
        return '<button type="button" class="va-tev' + evCls(ev.it) + '"' + evAttr(ev.it).replace('style="', 'style="top:' + top + 'px;height:' + h + 'px;left:calc(' + (ev.c * 100 / ev.n) + '% + 1px);width:calc(' + (100 / ev.n) + '% - 4px);') + '>' +
          '<strong>' + esc(ev.it.x.product) + '</strong><span>' + hm(ev.s) + '〜' + hm(ev.e) + '</span><span>' + esc(ev.it.x.name) + ' 様・' + ev.it.x.people + '名</span>' + (ev.it.x.status === 'wait' ? '<em>返事待ち</em>' : '') + (() => { const i = alInfo(ev.it.x); return i && i.key === 'yes' ? '<em>⚠ アレルギー ' + i.n + '名' + (i.alt ? '・代替 ' + i.alt : '') + '</em>' : ''; })() + '</button>';
      }).join('') + '</div>';
    };
    const body = '<div class="va-gt-body" style="' + cols + '"><div class="va-gt-gut">' + hours.map((h) => '<span style="height:' + PX + 'px">' + h + ':00</span>').join('') + '</div>' + days.map(colHtml).join('') + '</div>';
    return '<div class="va-gt' + (n === 1 ? ' one' : '') + '" style="--px:' + PX + 'px">' + head + allday + '<div class="va-gt-scroll">' + body + '</div></div>';
  }

  // 左側：ミニカレンダーと表示するカレンダー
  function calSide(d) {
    const first = d.slice(0, 8) + '01', mon = dateObj(first).getMonth();
    const start = addDays(first, -dateObj(first).getDay());
    const busy = {}; calItems(start, addDays(start, 42)).forEach((it) => { for (let x = it.from < start ? start : it.from; x < it.to; x = addDays(x, 1)) busy[x] = 1; });
    const mini = '<div class="va-mini"><div class="va-mini-h"><strong>' + dateObj(first).getFullYear() + '年' + (mon + 1) + '月</strong><span>' +
      '<button type="button" class="va-icon-btn va-gc-arrow" data-act="cal-mini" data-v="-1" aria-label="前の月">' + ic('left') + '</button>' +
      '<button type="button" class="va-icon-btn va-gc-arrow" data-act="cal-mini" data-v="1" aria-label="次の月">' + ic('right') + '</button></span></div>' +
      '<div class="va-mini-g">' + WD.map((w) => '<span class="va-mini-w">' + w + '</span>').join('') +
      Array.from({ length: 42 }, (_, i) => addDays(start, i)).map((x) => '<button type="button" class="va-mini-d' + (dateObj(x).getMonth() !== mon ? ' out' : '') + (x === TODAY ? ' today' : '') + (x === d ? ' sel' : '') + (busy[x] ? ' busy' : '') + '" data-act="cal-date" data-v="' + x + '" aria-label="' + jpDate(x) + '">' + dateObj(x).getDate() + '</button>').join('') + '</div></div>';
    const hide = S.calHide || {};
    const item = (key, label) => '<button type="button" class="va-calf" role="checkbox" aria-checked="' + !hide[key] + '" data-act="cal-toggle" data-v="' + esc(key) + '" style="--ev:' + (CAL_COLORS[key] || '#5f6368') + '"><span class="va-calf-box">' + (hide[key] ? '' : ic('check')) + '</span>' + esc(label) + '</button>';
    const filters = '<div class="va-calfs"><p class="va-calf-h">体験</p>' + PRODUCTS.map((p) => item('p:' + p, p)).join('') +
      '<p class="va-calf-h">手続き</p>' + item('k:deadline', 'アレルギー回答・振込の期限') + item('k:mail', '自動メールの送信予定') +
      '<p class="va-calf-note">枠線だけの予定は「返事待ち」です。期限は、回答・入金が済むと「✓」になります。</p></div>';
    return '<aside class="va-gc-side">' + mini + filters + '</aside>';
  }

  function pageCal() {
    if (S.calView === 'next') S.calView = 'list';
    const v = S.calView, d = S.calDate, dt = dateObj(d);
    const wkStart = addDays(d, -dt.getDay());
    const week = Array.from({ length: 7 }, (_, i) => addDays(wkStart, i));
    let title;
    if (v === 'month') title = dt.getFullYear() + '年' + (dt.getMonth() + 1) + '月';
    else if (v === 'week') { const a = dateObj(week[0]), b = dateObj(week[6]); title = a.getFullYear() + '年' + (a.getMonth() + 1) + '月' + (a.getMonth() !== b.getMonth() ? '〜' + (b.getMonth() + 1) + '月' : ''); }
    else if (v === 'day') title = dt.getFullYear() + '年' + jpDate(d);
    else title = '今後の予定';
    const views = [['day', '日'], ['week', '週'], ['month', '月'], ['list', '予定リスト']];
    const bar = '<div class="va-gc-bar">' +
      '<button type="button" class="va-btn va-gc-today" data-act="cal-date" data-v="' + TODAY + '">今日</button>' +
      (v !== 'list' ? '<span class="va-gc-arrows"><button type="button" class="va-icon-btn va-gc-arrow" data-act="cal-step" data-v="-1" aria-label="前へ">' + ic('left') + '</button>' +
        '<button type="button" class="va-icon-btn va-gc-arrow" data-act="cal-step" data-v="1" aria-label="次へ">' + ic('right') + '</button></span>' : '') +
      '<h2 class="va-gc-title">' + esc(title) + '</h2>' +
      '<div class="va-gc-views" role="group" aria-label="表示の切り替え">' + views.map(([k, l]) => '<button type="button" data-act="cal-view" data-v="' + k + '" aria-pressed="' + (v === k) + '" class="' + (v === k ? 'on' : '') + '">' + l + '</button>').join('') + '</div></div>';
    let main = v === 'month' ? calMonth(d) : v === 'week' ? calTime(week) : v === 'day' ? calTime([d]) : '<div class="va-gc-list">' + upcoming() + '</div>';
    if (v !== 'list') {
      const rs = v === 'month' ? d.slice(0, 8) + '01' : v === 'week' ? week[0] : d;

    var panel = tab === 'inq' ? inqPanel(db) : tab === 'stay'

      : (exps.length ? exps.map(expCard).join('') : '<div class="mt-6 rounded-[1.8rem] bg-white p-8 text-center text-sm text-[#657370] shadow-sm">体験の申込はまだありません。<a href="/" class="ml-1 font-bold text-[#0d4f55] underline">体験を探す</a></div>');

    el.innerHTML = '<div class="mx-auto max-w-5xl"><div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-end"><div><p class="text-xs font-bold tracking-[0.16em] text-[#2f6f4d]">MY TRIP</p>' +
      '<h1 class="mt-2 font-serif text-4xl font-semibold text-[#123e40]">忍野の旅程</h1><p class="mt-3 text-[#657370]">' + esc(name) + (dates.length ? '｜' + rangeText(dates) : '') + '</p></div>' +
      '<button type="button" class="' + BTN_OUTLINE + '" data-mp="toast" data-msg="宿泊と体験をまとめた旅程PDFを想定しています">' + ic('download', 'size-4') + '旅程を保存</button></div>' +
      '<div class="mt-8 grid gap-4 rounded-[1.6rem] bg-[#0d4f55] p-6 text-white sm:grid-cols-[180px_1fr]"><div><p class="text-xs font-bold tracking-[0.14em] text-[#b4dfc7]">TRIP OVERVIEW</p><p class="mt-2 font-serif text-2xl font-semibold">' + overviewTitle + '</p></div>' +
      '<div class="grid gap-3 text-sm sm:grid-cols-3"><p class="flex items-center gap-2">' + ic('bed', 'size-4 text-[#b4dfc7]') + '宿泊 ' + stayN + '件' + (gWait ? '（返事待ち ' + gWait + '）' : '') + '</p><p class="flex items-center gap-2">' + ic('msg', 'size-4 text-[#b4dfc7]') + expChip + '</p><p class="flex items-center gap-2">' + ic('check', 'size-4 text-[#b4dfc7]') + summary + '</p></div></div>' +
      '<div class="flex flex-col gap-2 mt-8"><div role="tablist" class="text-muted-foreground inline-flex w-fit items-center justify-center h-12 rounded-full bg-[#eaf1ed] p-1">' + tabs + '</div>' +
      '<div role="tabpanel" class="flex-1 outline-none">' + panel + '</div></div>' +
      '<section class="mt-10 rounded-[1.6rem] bg-white p-7 shadow-sm sm:flex sm:items-center sm:justify-between"><div><p class="text-xs font-bold tracking-[0.14em] text-[#2f6f4d]">COMPLETE YOUR TRIP</p><h2 class="mt-2 font-serif text-2xl font-semibold text-[#123e40]">体験を申し込む。</h2>' +
      '<p class="mt-2 text-sm text-[#657370]">そば打ち・ほうとう作り・よもぎ団子作りから選べます。</p></div><a href="/"><button type="button" class="' + BTN + 'mt-5 bg-[#d76b3e] text-white hover:bg-[#c45b31] sm:mt-0">体験を探す</button></a></section></div>';
    el.setAttribute('data-rendered', '1');
  }

  // トースト（元サイトの通知と同じ位置・見た目）
  var box;
  function toast(msg) {
    if (!box) { box = document.createElement('ol'); box.className = 'mp-toaster'; document.body.appendChild(box); }
    var li = document.createElement('li'); li.className = 'mp-toast'; li.setAttribute('data-sonner-toast', ''); li.textContent = msg; box.appendChild(li);
    requestAnimationFrame(function () { li.classList.add('show'); });
    setTimeout(function () { li.classList.remove('show'); setTimeout(function () { li.remove(); }, 300); }, 4000);
  }

  function mountIfNeeded() {
    var el = document.getElementById('oshino-mypage');
    if (el && !el.getAttribute('data-rendered')) { var qt = new URLSearchParams(window.__hs ? window.__hs() : '').get('tab'); tab = ['stay', 'exp', 'inq'].indexOf(qt) >= 0 ? qt : 'stay'; render(el); }
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('#oshino-mypage [data-mp]'); if (!t) return;
    var a = t.getAttribute('data-mp');
    if (a === 'tab') { tab = t.getAttribute('data-v'); render(document.getElementById('oshino-mypage')); }
    if (a === 'toast') toast(t.getAttribute('data-msg'));
    if (a === 'doc') showDoc(t.getAttribute('data-v'), t.getAttribute('data-id'));
    if (a === 'chg') {
      var cid = t.getAttribute('data-v'); tab = 'inq'; render(document.getElementById('oshino-mypage'));
      var sj = document.getElementById('mpq-subject'), bd = document.getElementById('mpq-body'), tp = document.getElementById('mpq-topic');
      if (sj) sj.value = '変更・キャンセルの依頼（' + cid + '）'; if (tp) tp.value = '体験';
      if (bd) { bd.value = 'ご希望の内容（日時・人数の変更／キャンセル）：\n'; bd.focus(); }
      toast('キャンセル料：前日の正午まで0%／前日の正午〜17:00は50%／前日17:00以降は100%です');
    }
    if (a === 'allergy-none') { DB.answerAllergy(t.getAttribute('data-v'), { count: 0, detail: '' }); toast('食物アレルギーの確認に回答しました（対象者なし）'); }
    if (a === 'pay-report') { DB.reportPay(t.getAttribute('data-v')); toast('振込のご報告を受け付けました。入金を確認したらメールでお知らせします'); }
    if (a === 'inq-send') {
      var g = function (id) { var x = document.getElementById(id); return x ? x.value.trim() : ''; };
      var r = { name: g('mpq-name'), email: g('mpq-email'), topic: g('mpq-topic'), subject: g('mpq-subject'), body: g('mpq-body') };
      if (!r.name || !r.email || !r.subject || !r.body) { toast('お名前・メールアドレス・件名・内容を入力してください'); return; }
      DB.addInquiry(r); toast('問い合わせを送信しました。回答はこのページに表示されます');
    }
    if (a === 'inq-reply') {
      var id = t.getAttribute('data-v'), ta = document.getElementById('mpq-re-' + id);
      if (!ta || !ta.value.trim()) { toast('返信の内容を入力してください'); return; }
      DB.userReplyInquiry(id, ta.value.trim()); toast('返信を送信しました');
    }
  });
  // マイページ内のリンク（体験を探す等）は元アプリのルーターへ
  document.addEventListener('click', function (e) {
    var a = e.target.closest('#oshino-mypage a[href^="/"]'); if (!a) return;
    e.preventDefault(); history.pushState(null, '', a.getAttribute('href')); window.dispatchEvent(new PopStateEvent('popstate'));
  });
  DB.on(function () { var el = document.getElementById('oshino-mypage'); if (el) render(el); });
  new MutationObserver(mountIfNeeded).observe(document.documentElement, { childList: true, subtree: true });
})();

</script>
<script>
/* 食物アレルギー確認のページ（#/allergy?id=予約番号）：確定メールのリンクから開いて回答する */
(function () {
  'use strict';
  var DB = window.__oshinoDB;
  var WD = ['日', '月', '火', '水', '木', '金', '土'];
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var jd = function (iso) { var x = new Date(iso + 'T00:00:00'); return x.getFullYear() + '年' + (x.getMonth() + 1) + '月' + x.getDate() + '日（' + WD[x.getDay()] + '）'; };
  var foodsFor = DB.allergyFoods, SHEET = DB.ALLERGY_SHEET;
  var CATS = DB.ALLERGY_CATS || [['severe', '重度アレルギー', 'ごく少量でも症状が出る'], ['alt', '代替希望', '別の食事（代替食）を希望する'], ['other', 'その他', '原因食品を除けば参加できる など']];
  var label = function (list, v) { var f = list.filter(function (x) { return x[0] === v; })[0]; return f ? f[1] : ''; };
  var el = null, visible = false;
  var st = { id: null, has: null, rows: [], respondent: '', mail: '', cls: '', editing: false, err: '', lookupErr: '' };
  var blank = function () { return { cls: '', name: '', cat: '', foods: [], other: '', ana: '', epi: '', note: '' }; };
  var getB = function () { return st.id ? DB.get().bookings.find(function (x) { return x.id === st.id; }) : null; };
  var orgOf = function (b) { return b.group && b.group !== '個人' ? b.group : ''; };

  function collect() {
    if (!el) return;
    var h = el.querySelector('input[name="alg-has"]:checked'); if (h) st.has = h.value;
    var ag = el.querySelector('#alg-agree'); if (ag) st.agree = ag.checked;
    var g = function (id) { var x = el.querySelector('#' + id); return x ? x.value : null; };
    if (g('alg-resp') !== null) st.respondent = g('alg-resp');
    if (g('alg-mail') !== null) st.mail = g('alg-mail');
    if (g('alg-cls') !== null) st.cls = g('alg-cls');
    var rows = el.querySelectorAll('.alg-row'); if (!rows.length) return;
    st.rows = Array.prototype.map.call(rows, function (row) {
      var q = function (f) { return row.querySelector('[data-f="' + f + '"]'); };
      var pick = function (f) { return (row.querySelector('[data-f="' + f + '"]:checked') || {}).value || ''; };
      return {
        cls: q('cls').value, name: q('name').value, other: q('other').value, note: q('note').value,
        cat: pick('cat'), ana: pick('ana'), epi: pick('epi'),
        foods: Array.prototype.map.call(row.querySelectorAll('[data-f="food"]:checked'), function (c) { return c.value; })
      };
    });
  }
  function counts(rows) {
    var n = function (c) { return rows.filter(function (r) { return r.cat === c; }).length; };
    return { sev: n('severe'), alt: n('alt'), other: n('other') };
  }
  var foodText = function (r) { return r.foods.concat(r.other.trim() ? [r.other.trim()] : []).join('・'); };

  function header() {
    return '<header class="alg-top"><a href="/" data-alg="nav" class="alg-logo"><span>OSHINO VILLAGE</span>忍野 旅の予約</a><a href="/mypage" data-alg="nav" class="alg-mp">予約確認（マイページ）</a></header>';
  }
  function summary(b) {
    var v = b.venue ? DB.venueInfo(b.venue) : null, org = orgOf(b);
    return '<section class="alg-card alg-sum"><p class="alg-kicker">ご予約内容</p><dl>' +
      '<dt>予約番号</dt><dd>' + esc(b.id) + '</dd>' + (org ? '<dt>団体名</dt><dd>' + esc(org) + '</dd>' : '') +
      '<dt>代表者</dt><dd>' + esc(b.name) + ' 様</dd><dt>体験</dt><dd>' + esc(b.product) + '</dd>' +
      '<dt>日時</dt><dd>' + jd(b.date) + ' ' + esc(b.time) + '〜</dd><dt>人数</dt><dd>' + b.people + '名</dd>' +
      '<dt>会場</dt><dd>' + (v ? esc(v.name) : '決まりしだいご案内します') + '</dd></dl></section>';
  }
  function lookup() {
    return '<section class="alg-card"><h1 class="alg-h1">食物アレルギーの確認</h1><p class="alg-lead">確定メールに書かれている予約番号と、申し込みに使ったメールアドレスを入力してください。</p>' +
      '<div class="alg-fields"><label>予約番号<input id="alg-q-id" placeholder="例：OE-202610-001" value="' + esc(st.id || '') + '"></label><label>メールアドレス<input id="alg-q-mail" type="email" placeholder="例：taro@example.jp"></label></div>' +
      (st.lookupErr ? '<p class="alg-err" role="alert">' + esc(st.lookupErr) + '</p>' : '') +
      '<button type="button" class="alg-btn alg-primary" data-alg="lookup">予約を表示する</button></section>';
  }
  function doneView(b) {
    var a = b.allergy, people = a.people || [];
    return summary(b) + '<section class="alg-card alg-done"><div class="alg-ok">✓</div><h1 class="alg-h1">回答を受け付けました</h1><p class="alg-lead">' + esc(a.at) + ' に受け付けました。内容は観光協会と会場の民宿で確認します。</p>' +
      '<p class="alg-result">食物アレルギーのある方：<b>' + a.count + '名</b>' + (people.length ? '（重度 ' + counts(people).sev + '名・代替希望 ' + counts(people).alt + '名・その他 ' + counts(people).other + '名）' : '') + '</p>' +
      (people.length ? '<div class="alg-tbl"><table><tr><th>氏名</th><th>区分</th><th>原因食品</th><th>アナフィラキシー</th><th>エピペン</th><th>備考</th></tr>' + people.map(function (r) {
        return '<tr><td>' + esc((r.cls ? r.cls + ' ' : '') + r.name) + '</td><td>' + esc(label(CATS, r.cat)) + '</td><td>' + esc(foodText(r)) + '</td><td>' + esc(r.ana || '—') + '</td><td>' + esc(r.epi || '—') + '</td><td>' + esc(r.note || '—') + '</td></tr>';
      }).join('') + '</table></div>' : (a.detail ? '<p class="alg-lead">' + esc(a.detail) + '</p>' : '')) +
      '<p class="alg-lead">内容を変える場合は、' + jd(DB.deadlines(b).allergy) + ' までに修正してください。期限を過ぎた場合は、観光協会（' + esc(DB.KYOKAI.phone) + '）へお電話ください。</p>' +
      '<div class="alg-actions"><button type="button" class="alg-btn" data-alg="edit">回答を修正する</button><a href="/mypage" data-alg="nav" class="alg-btn alg-primary">予約確認ページへ</a></div></section>';
  }
  function rowHtml(r, i, product) {
    var radio = function (f, v, text) { return '<label class="alg-pill"><input type="radio" name="alg-' + f + '-' + i + '" data-f="' + f + '" value="' + v + '"' + (r[f] === v ? ' checked' : '') + '><span>' + text + '</span></label>'; };
    var foods = foodsFor(product);
    return '<div class="alg-row"><div class="alg-row-h"><b>対象者 ' + (i + 1) + '</b>' + (st.rows.length > 1 ? '<button type="button" class="alg-del" data-alg="del" data-i="' + i + '">削除</button>' : '') + '</div>' +
      '<div class="alg-2col"><label class="alg-l">クラス・所属<small>任意</small><input data-f="cls" value="' + esc(r.cls) + '" placeholder="例：1組／営業部"></label>' +
      '<label class="alg-l">氏名<small class="alg-req">必須</small><input data-f="name" value="' + esc(r.name) + '" placeholder="例：忍野 太郎"></label></div>' +
      '<div class="alg-l">区分<small class="alg-req">必須</small><div class="alg-cats">' + CATS.map(function (c) {
        return '<label class="alg-cat"><input type="radio" name="alg-cat-' + i + '" data-f="cat" value="' + c[0] + '"' + (r.cat === c[0] ? ' checked' : '') + '><span><b>' + c[1] + '</b><small>' + c[2] + '</small></span></label>';
      }).join('') + '</div></div>' +
      '<div class="alg-l">アレルギー原因食品<small class="alg-req">1つ以上</small><small class="alg-hint">' + (SHEET[product] ? 'この体験（' + esc(product) + '）で使う食材です。当てはまるものをすべて選んでください。' : '当てはまるものをすべて選んでください。') + '</small>' +
      (function () {
        // アレルゲンになりやすい食材を先に、そのほかの食材はたたむ
        var chip = function (f) { return '<label class="alg-food"><input type="checkbox" data-f="food" value="' + esc(f[0]) + '"' + (r.foods.indexOf(f[0]) >= 0 ? ' checked' : '') + '><span>' + esc(f[0]) + (f[1] ? '<small>アレルゲン：' + esc(f[1]) + '</small>' : '') + (f[2] ? '<small>※' + esc(f[2]) + '</small>' : '') + '</span></label>'; };
        var main = foods.filter(function (f) { return f[1] || f[2] || !SHEET[product]; }), rest = foods.filter(function (f) { return !(f[1] || f[2] || !SHEET[product]); });
        var open = rest.some(function (f) { return r.foods.indexOf(f[0]) >= 0; });
        return '<div class="alg-foods">' + main.map(chip).join('') + '</div>' + (rest.length ? '<details class="alg-morefoods"' + (open ? ' open' : '') + '><summary>そのほかの食材（' + rest.length + '）</summary><div class="alg-foods">' + rest.map(chip).join('') + '</div></details>' : '');
      })() +
      '<input data-f="other" value="' + esc(r.other) + '" placeholder="上にない食品があれば入力（例：キウイ、ごま）"></div>' +
      '<div class="alg-2col"><div class="alg-l">アナフィラキシー<small class="alg-req">必須</small><div class="alg-pills">' + radio('ana', '有', '有') + radio('ana', '無', '無') + '</div></div>' +
      '<div class="alg-l">エピペンの処方<small class="alg-req">必須</small><div class="alg-pills">' + radio('epi', '有', '有') + radio('epi', '無', '無') + '</div></div></div>' +
      '<label class="alg-l">備考<small>任意</small><textarea data-f="note" rows="3" placeholder="例：ごく少量でも症状が出るため、別鍋での調理を希望します／エピペンは本人が持参します">' + esc(r.note) + '</textarea></label></div>';
  }
  function formView(b) {
    var dl = DB.deadlines(b), c = counts(st.rows), yes = st.has === 'yes', org = orgOf(b);
    return summary(b) + '<section class="alg-card"><h1 class="alg-h1">食物アレルギーの確認</h1>' +
      '<p class="alg-lead">体験では、作った料理をその場で召し上がっていただきます。安全に食事をご用意するため、参加者の食物アレルギーについて教えてください。</p>' +
      '<p class="alg-due">回答期限：' + jd(dl.allergy) + '（体験日の2週間前）' + (dl.allergy < DB.clock() ? '<br><small>期限を過ぎています。回答はできますが、対応できない場合があります。</small>' : '') + '</p>' +
      '<div class="alg-block"><p class="alg-step">1　ご担当者と対象の方の有無</p>' +
      '<div class="alg-2col"><label class="alg-l">' + (org ? '団体名・学校名' : 'お名前') + '<input value="' + esc(org || b.name) + '" disabled></label>' +
      '<label class="alg-l">クラス<small>任意</small><input id="alg-cls" value="' + esc(st.cls) + '" placeholder="例：1組"></label></div>' +
      '<div class="alg-2col"><label class="alg-l">ご担当者のお名前<input id="alg-resp" value="' + esc(st.respondent) + '"></label>' +
      '<label class="alg-l">ご担当者のメールアドレス<input id="alg-mail" type="email" value="' + esc(st.mail) + '"></label></div>' +
      '<fieldset class="alg-q"><legend>参加者 ' + b.people + '名の中に、食事の対応が必要な方はいますか？</legend><div class="alg-big">' +
      '<label class="alg-opt' + (st.has === 'no' ? ' on' : '') + '"><input type="radio" name="alg-has" value="no"' + (st.has === 'no' ? ' checked' : '') + '><span><b>いない（0名）</b><small>このまま回答できます</small></span></label>' +
      '<label class="alg-opt' + (yes ? ' on' : '') + '"><input type="radio" name="alg-has" value="yes"' + (yes ? ' checked' : '') + '><span><b>いる</b><small>対象の方ごとに確認書を入力します</small></span></label></div></fieldset>' +
      (st.has ? '<label class="alg-agree"><input type="checkbox" id="alg-agree"' + (st.agree ? ' checked' : '') + '> 回答内容を、観光協会と会場の民宿で、体験の食事の準備のためだけに使うことに同意します（体験のあと、一定期間で削除します）</label>' : '') +
      '</div>' +
      (yes ? '<div class="alg-block"><p class="alg-step">2　対象の方ごとの内容</p><div class="alg-rows">' + st.rows.map(function (r, i) { return rowHtml(r, i, b.product); }).join('') + '</div>' +
        '<button type="button" class="alg-btn alg-add" data-alg="add">＋ 対象者を追加</button>' +
        '<table class="alg-s1"><caption>対象の方の人数（自動で集計します）</caption><tr><th>重度アレルギー</th><td>' + c.sev + ' 名</td></tr><tr><th>代替希望</th><td>' + c.alt + ' 名</td></tr><tr><th>その他</th><td>' + c.other + ' 名</td></tr><tr><th>合計</th><td>' + st.rows.length + ' 名</td></tr></table>' +
        '<details class="alg-guide"><summary>食事の対応についての注意事項</summary><ol><li>原則として、食物アレルギー等で医師の指示により学校や家庭でアレルギー食事対応を行っており、施設での対応を希望する方を対象とします。</li><li>学校の場合は、必要事項を担任の先生がまとめて入力してください。</li><li>その他の事情で食事の対応が必要な場合も、同じように入力してください。</li><li>対応が難しくお受けできない場合は、ご家庭から代替食品をお持ちいただき、その提供をします（代替食品の持参対応は体験施設のみ行います）。</li></ol></details></div>' : '') +
      (st.err ? '<p class="alg-err" role="alert">' + esc(st.err) + '</p>' : '') +
      '<div class="alg-actions">' + (st.editing ? '<button type="button" class="alg-btn" data-alg="cancel">修正をやめる</button>' : '') +
      '<button type="button" class="alg-btn alg-primary" data-alg="submit"' + (st.has ? '' : ' disabled') + '>回答する</button></div>' +
      '<p class="alg-small">回答は観光協会と会場の民宿だけが確認します。民宿が記入する「対応方法」は、民宿から連絡します。</p></section>';
  }
  function render() {
    if (!el) return;
    var b = getB(), body;
    if (!b) body = lookup();
    else if (b.cancelled) body = summary(b) + '<section class="alg-card"><h1 class="alg-h1">この予約は取り消されています</h1><p class="alg-lead">回答の必要はありません。</p></section>';
    else if (b.status === 'wait') body = summary(b) + '<section class="alg-card"><h1 class="alg-h1">予約の確定をお待ちください</h1><p class="alg-lead">予約が確定すると、食物アレルギーの確認をお願いするメールが届きます。</p></section>';
    else if (b.allergy && !st.editing) body = doneView(b);
    else body = formView(b);
    el.innerHTML = header() + '<main class="alg-main">' + body + '</main>';
  }
  function startEdit(b) {
    var a = b.allergy || {};
    st.editing = !!b.allergy; st.err = '';
    st.has = b.allergy ? (a.count ? 'yes' : 'no') : null;
    st.rows = a.people && a.people.length ? JSON.parse(JSON.stringify(a.people)) : [blank()];
    st.respondent = a.respondent || b.name;
    st.mail = a.mail || b.email || ''; st.cls = a.cls || '';
  }
  function go(href) { history.pushState(null, '', href); window.dispatchEvent(new PopStateEvent('popstate')); }
  function onClick(e) {
    var t = e.target.closest('[data-alg]'); if (!t) return;
    var a = t.getAttribute('data-alg'), b = getB();
    if (a === 'nav') { e.preventDefault(); go(t.getAttribute('href')); return; }
    collect();
    if (a === 'lookup') {
      var id = el.querySelector('#alg-q-id').value.trim().toUpperCase(), mail = el.querySelector('#alg-q-mail').value.trim().toLowerCase();
      var hit = DB.get().bookings.find(function (x) { return x.id === id && String(x.email || '').toLowerCase() === mail; });
      if (!hit) { st.lookupErr = '予約が見つかりませんでした。予約番号とメールアドレスをご確認ください。'; render(); return; }
      st.lookupErr = ''; go('/allergy?id=' + hit.id); return;
    }
    if (a === 'add') { st.rows.push(blank()); render(); return; }
    if (a === 'del') { st.rows.splice(Number(t.getAttribute('data-i')), 1); render(); return; }
    if (a === 'edit') { startEdit(b); render(); window.scrollTo(0, 0); return; }
    if (a === 'cancel') { st.editing = false; render(); return; }
    if (a === 'submit' && b) {
      var yes = st.has === 'yes', rows = yes ? st.rows : [];
      var bad = rows.map(function (r, i) {
        var miss = [];
        if (!r.name.trim()) miss.push('氏名'); if (!r.cat) miss.push('区分'); if (!foodText(r)) miss.push('原因食品');
        if (!r.ana) miss.push('アナフィラキシー'); if (!r.epi) miss.push('エピペンの処方');
        return miss.length ? '対象者 ' + (i + 1) + '：' + miss.join('・') : '';
      }).filter(Boolean);
      if (bad.length) { st.err = '入力されていない項目があります（' + bad.join('／') + '）'; render(); return; }
      if (!st.agree) { st.err = '回答内容の取り扱いへの同意にチェックを入れてください。'; render(); return; }
      if (yes && rows.length > b.people) { st.err = '対象者が参加人数（' + b.people + '名）より多くなっています。'; render(); return; }
      st.err = ''; st.editing = false;
      var c = counts(rows);
      DB.answerAllergy(b.id, {
        count: rows.length, people: rows, respondent: st.respondent.trim() || b.name, mail: st.mail.trim(), cls: st.cls.trim(), sheet: { sev: c.sev, alt: c.alt, other: c.other },
        detail: rows.map(function (r) { return (r.cls ? r.cls + ' ' : '') + r.name + '／' + label(CATS, r.cat) + '／' + foodText(r) + '／アナフィラキシー' + r.ana + '・エピペン' + r.epi + (r.note ? '（' + r.note + '）' : ''); }).join('\n')
      });
      window.scrollTo(0, 0);
    }
  }
  function onChange(e) {
    var f = e.target.getAttribute('data-f'); if (e.target.name === 'alg-has' || f === 'cat') { collect(); st.err = ''; render(); }
  }
  function sync() {
    var on = (window.__hp ? window.__hp() : location.pathname) === '/allergy';
    var app = document.getElementById('root');
    if (on) {
      if (!el) { el = document.createElement('div'); el.id = 'oshino-allergy'; document.body.appendChild(el); el.addEventListener('click', onClick); el.addEventListener('change', onChange); }
      var id = new URLSearchParams(window.__hs ? window.__hs() : '').get('id');
      if (!visible || id !== st.id) { st.id = id; st.lookupErr = ''; var b = getB(); if (b) startEdit(b); st.editing = false; window.scrollTo(0, 0); }
      visible = true; el.hidden = false; if (app) app.hidden = true; render();
      document.title = '食物アレルギーの確認｜忍野 旅の予約';
    } else if (visible) {
      visible = false; el.hidden = true; if (app) app.hidden = false; document.title = '忍野村 宿泊・体験予約モック';
    }
  }
  DB.on(function () { if (visible) render(); });
  window.addEventListener('hashchange', sync);
  window.addEventListener('popstate', sync);
  ['pushState', 'replaceState'].forEach(function (m) { var o = history[m]; history[m] = function () { var r = o.apply(this, arguments); setTimeout(sync, 0); return r; }; });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', sync); else sync();
})();
</script>

<script>
/* 民宿用ページ（#/inn?id=予約番号&k=鍵&v=民宿名）：民宿が予約の内容を見て、受け入れ可否・アレルギーの対応・当日の受付を返す */
(function () {
  'use strict';
  var DB = window.__oshinoDB;
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var el = null, visible = false, q = {}, msg = '', lastHref = '';
  var getB = function () { return q.id ? DB.get().bookings.find(function (x) { return x.id === q.id; }) : null; };
  var catL = function (c) { var x = (DB.ALLERGY_CATS || []).filter(function (y) { return y[0] === c; })[0]; return x ? x[1] : ''; };
  function render() {
    if (!el) return;
    var b = getB(), body = '';
    var head = '<header class="alg-top"><span class="alg-logo"><span>OSHINO VILLAGE</span>忍野村観光協会　民宿用ページ</span>' + (b && b.venue && DB.innOf(q.v || b.venue) && q.k === b.innKey ? '<a class="alg-mp" href="' + esc(DB.innListLink(q.v || b.venue)) + '">貴館の予約一覧</a>' : '') + '</header>';
    if (!b || b.innKey !== q.k) { el.innerHTML = head + '<main class="alg-main"><section class="alg-card"><h1 class="alg-h1">ページを開けませんでした</h1><p class="alg-lead">リンクが正しくありません。メールのリンクから開き直すか、観光協会へお電話ください（' + esc(DB.KYOKAI.phone) + '）。</p></section></main>'; return; }
    var mine = !q.v || q.v === b.venue;
    var a = b.allergy, ppl = (a && a.people) || [];
    var sum = '<section class="alg-card alg-sum"><p class="alg-kicker">' + esc(q.v || b.venue || '') + ' 御中</p><dl>' +
      '<dt>予約番号</dt><dd>' + esc(b.id) + '</dd><dt>団体名</dt><dd>' + esc(b.group && b.group !== '個人' ? b.group : '—') + '</dd><dt>代表者</dt><dd>' + esc(b.name) + ' 様（' + esc(b.phone || '—') + '）</dd>' +
      '<dt>体験</dt><dd>' + esc(b.product) + '</dd><dt>日時</dt><dd>' + DB.jpd(b.date) + ' ' + esc(b.time) + '〜（約2時間）</dd><dt>人数</dt><dd>' + b.people + '名</dd>' +
      '<dt>状態</dt><dd>' + (b.cancelled ? 'キャンセル' : !mine ? '会場が変更になりました' : b.status === 'wait' ? '受け入れの確認中' : b.status === 'done' ? '受付済み' : '確定') + '</dd>' + (b.note ? '<dt>ご連絡事項</dt><dd>' + esc(b.note) + '</dd>' : '') + '</dl></section>';
    if (b.cancelled || !mine) {
      body = sum + '<section class="alg-card"><h1 class="alg-h1">' + (b.cancelled ? 'この予約はキャンセルになりました' : '貴館での受け入れは不要になりました') + '</h1><p class="alg-lead">ご準備いただいていた場合は、申し訳ございません。ご不明な点は観光協会（' + esc(DB.KYOKAI.phone) + '）までお問い合わせください。</p></section>';
    } else {
      var rq = b.innReq && b.innReq.venue === b.venue ? b.innReq : null;
      if (b.status === 'wait' && rq && rq.state === 'asked') {
        body += '<section class="alg-card"><h1 class="alg-h1">受け入れのご確認</h1><p class="alg-lead">この体験を受け入れられるか、お知らせください。</p>' +
          '<label class="alg-l">ひとこと（任意）<input id="inn-reqnote" placeholder="例：13時開始なら可能です"></label>' +
          '<div class="alg-actions"><button type="button" class="alg-btn" data-inn="req" data-v="ng">受け入れできない</button><button type="button" class="alg-btn alg-primary" data-inn="req" data-v="ok">受け入れできる</button></div></section>';
      } else if (b.status === 'wait' && rq) {
        body += '<section class="alg-card"><h1 class="alg-h1">' + (rq.state === 'ok' ? '受け入れOKのお返事をいただきました' : '受け入れできないとのお返事をいただきました') + '</h1><p class="alg-lead">観光協会で予約を確定したら、あらためてご連絡します。</p></section>';
      }
      var recent = (b.innLog || []).filter(function (l) { return l.inn === b.venue; })[0];
      if (recent && (recent.kind === 'changed' || (recent.kind === 'allergy' && b.allergyUpdated))) body += '<section class="alg-card inn-change"><p class="alg-kicker">前回のご連絡から変わったこと（' + esc(recent.at) + '）</p><p class="alg-lead">' + (recent.kind === 'changed' ? esc(b.lastChange || '').replace(/\n/g, '<br>') : 'お客様が、食物アレルギーの回答を修正しました。下の内容をご確認ください。') + '</p></section>';
      var attendSec = '';
      if (b.status !== 'wait') {
        var dl = DB.innDeadline(b);
        attendSec = '<section class="alg-card"><h1 class="alg-h1">当日の受付</h1>' + (b.attend ? '<p class="alg-lead">' + (b.attend.noShow ? '来場されなかったと記録しました' : b.attend.count + '名の来場を記録しました') + '（' + esc(b.attend.at) + '）。</p>' : '') +
          '<label class="alg-l">来場した人数<input id="inn-count" type="number" min="0" value="' + (b.attend ? b.attend.count : b.people) + '"></label>' +
          '<div class="alg-actions"><button type="button" class="alg-btn" data-inn="noshow">来なかった</button><button type="button" class="alg-btn alg-primary" data-inn="attend">来場を記録する</button></div></section>';
        if (b.date === DB.clock()) { body += attendSec; attendSec = ''; }
        body += '<section class="alg-card"><h1 class="alg-h1">食物アレルギー</h1>' +
          (!a ? '<p class="alg-lead">お客様の回答待ちです（回答期限 ' + DB.jpd(DB.deadlines(b).allergy) + '）。回答が届いたら、メールでお知らせします。</p>'
            : !a.count ? '<p class="alg-lead">対象の方はいません（0名）。</p>'
              : '<p class="alg-due">対応方法の記入期限：' + DB.jpd(dl) + '</p><p class="alg-lead">対象の方ごとに、会場での対応方法を記入してください。会場での対応が難しい場合は「代替食品の持参をお願いしたい」を選ぶと、観光協会からお客様へ持参をお願いするメールが送られます。</p>' +
                ppl.map(function (p, i) {
                  return '<div class="alg-row"><div class="alg-row-h"><b>' + esc((p.cls ? p.cls + ' ' : '') + p.name) + '</b><span class="alg-tag">' + esc(catL(p.cat)) + '</span></div>' +
                    '<p class="inn-al">原因食品：<b>' + esc((p.foods || []).concat(p.other ? [p.other] : []).join('・')) + '</b>　アナフィラキシー：<b>' + esc(p.ana || '—') + '</b>　エピペン：<b>' + esc(p.epi || '—') + '</b>' + (p.note ? '<br>お客様の備考：' + esc(p.note) : '') + '</p>' +
                    '<label class="alg-l">会場での対応<select data-inn-can="' + i + '"><option value="ok"' + (p.canDo !== 'bring' ? ' selected' : '') + '>会場で対応する</option><option value="bring"' + (p.canDo === 'bring' ? ' selected' : '') + '>代替食品の持参をお願いしたい</option></select></label>' +
                    '<label class="alg-l">対応方法<input data-inn-how="' + i + '" list="inn-howto" value="' + esc(p.howTo || '') + '" placeholder="選ぶか、書いてください"></label></div>';
                }).join('') + '<datalist id="inn-howto"><option value="除去して提供"><option value="別鍋で調理して提供"><option value="代替食を用意"><option value="原因食品を使わない献立に変更"><option value="代替食品の持参をお願いしたい"></datalist>' +
                '<div class="alg-actions"><button type="button" class="alg-btn alg-primary" data-inn="allergy">対応方法を送る</button></div>' +
                (a.innAt ? '<p class="alg-small">最後に送った日時：' + esc(a.innAt) + '</p>' : '')) + '</section>';
        body += attendSec;
      }
    }
    el.innerHTML = head + '<main class="alg-main">' + sum.replace(sum, '') + (body.indexOf('alg-sum') >= 0 ? '' : sum) + body + (msg ? '<p class="alg-done-msg" role="status">' + esc(msg) + '</p>' : '') + '</main>';
  }
  function onClick(e) {
    var t = e.target.closest('[data-inn]'); if (!t) return;
    var a = t.getAttribute('data-inn'), b = getB(), by = (q.v || b.venue) + '（民宿用ページ）';
    if (a === 'req') { DB.innReply(b.id, { req: t.getAttribute('data-v'), reqNote: (el.querySelector('#inn-reqnote') || {}).value || '' }, by); msg = '受け入れ可否を観光協会へ送りました。'; }
    if (a === 'allergy') {
      var rows = (b.allergy.people || []).map(function (p, i) { return { howTo: (el.querySelector('[data-inn-how="' + i + '"]') || {}).value || '', canDo: (el.querySelector('[data-inn-can="' + i + '"]') || {}).value || 'ok' }; });
      DB.innReply(b.id, { allergy: rows }, by); msg = '対応方法を観光協会へ送りました。';
    }
    if (a === 'attend' || a === 'noshow') { DB.innReply(b.id, { attend: { count: a === 'noshow' ? 0 : (el.querySelector('#inn-count') || {}).value, noShow: a === 'noshow' } }, by); msg = '当日の受付を記録しました。'; }
    render(); window.scrollTo(0, 0);
  }
  function sync() {
    var on = (window.__hp ? window.__hp() : location.pathname) === '/inn';
    var app = document.getElementById('root');
    if (on) {
      if (!el) { el = document.createElement('div'); el.id = 'oshino-inn'; document.body.appendChild(el); el.addEventListener('click', onClick); }
      var sp = new URLSearchParams(window.__hs ? window.__hs() : '');
      var href = location.hash, fresh = href !== lastHref; lastHref = href;
      if (fresh) { q = { id: sp.get('id'), k: sp.get('k'), v: sp.get('v') }; msg = ''; }
      var act = fresh ? sp.get('do') : null, bb = getB();
      if ((act === 'ok' || act === 'ng') && bb && bb.innKey === q.k && (!q.v || q.v === bb.venue)) {
        if (bb.innReq && bb.innReq.state === 'asked') { DB.innReply(bb.id, { req: act }, (q.v || bb.venue) + '（メールのボタン）'); msg = act === 'ok' ? '「受け入れる」を観光協会へ送りました。ありがとうございます。' : '「受け入れできない」を観光協会へ送りました。'; }
        else if (bb.innReq) msg = 'この予約の受け入れの返事は、すでに届いています。';
      }
      visible = true; el.hidden = false; if (app) app.hidden = true; render(); document.title = '民宿用ページ｜忍野村観光協会';
    } else if (visible) { visible = false; el.hidden = true; if (app) app.hidden = false; }
  }
  DB.on(function () { if (visible) render(); });
  window.addEventListener('hashchange', sync); window.addEventListener('popstate', sync);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', sync); else sync();
})();
</script>

<script>
/* 民宿ごとの予約一覧（#/inn-list?v=民宿名&k=鍵）：民宿が自分の予約をまとめて見る */
(function () {
  'use strict';
  var DB = window.__oshinoDB;
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var WD = ['日', '月', '火', '水', '木', '金', '土'];
  var md = function (iso) { var d = new Date(iso + 'T00:00:00'); return (d.getMonth() + 1) + '/' + d.getDate() + '（' + WD[d.getDay()] + '）'; };
  var el = null, visible = false, q = {}, showPast = false;
  function render() {
    if (!el) return;
    var inn = DB.innOf(q.v);
    var head = '<header class="alg-top"><span class="alg-logo"><span>OSHINO VILLAGE</span>忍野村観光協会　民宿用ページ</span></header>';
    if (!inn || !inn.key || inn.key !== q.k) { el.innerHTML = head + '<main class="alg-main"><section class="alg-card"><h1 class="alg-h1">ページを開けませんでした</h1><p class="alg-lead">リンクが正しくありません。観光協会へお電話ください（' + esc(DB.KYOKAI.phone) + '）。</p></section></main>'; return; }
    var today = DB.clock(), made = false;
    var list = DB.get().bookings.filter(function (b) { return b.venue === q.v && (b.innReq || b.status !== 'wait'); }).sort(function (a, b) { return (a.date + a.time).localeCompare(b.date + b.time); });
    var up = list.filter(function (b) { return b.date >= today; }), past = list.filter(function (b) { return b.date < today; });
    var card = function (b) {
      if (!b.innKey) { DB.innLink(b, q.v); made = true; }
      var a = b.allergy, ppl = (a && a.people) || [], need = [];
      if (b.status === 'wait' && b.innReq && b.innReq.state === 'asked') need.push('受け入れの返事をお願いします');
      if (b.status === 'ok' && a && a.count && ppl.some(function (p) { return !(p.howTo || '').trim(); })) need.push('アレルギーの対応方法をお願いします（期限 ' + md(DB.innDeadline(b)) + '）');
      if (b.status === 'ok' && b.date === today && !b.attend) need.push('今日の受付を記録してください');
      var st = b.cancelled ? 'キャンセル' : b.status === 'wait' ? '確認中' : b.status === 'done' ? '受付済み' : '確定';
      return '<a class="inl-card' + (b.cancelled ? ' x' : '') + (need.length ? ' need' : '') + '" href="' + esc(DB.innLink(b, q.v)) + '">' +
        '<span class="inl-d"><b>' + md(b.date) + '</b>' + esc(b.time) + '</span><span class="inl-b"><b>' + esc(b.product) + '・' + b.people + '名</b>' +
        '<small>' + esc(b.group && b.group !== '個人' ? b.group : b.name + ' 様') + '・' + st + '・アレルギー ' + (a ? (a.count ? a.count + '名' : 'なし') : '回答待ち') + '</small>' +
        need.map(function (n) { return '<em>' + esc(n) + '</em>'; }).join('') + '</span><span class="inl-go">›</span></a>';
    };
    var html = head + '<main class="alg-main"><section class="alg-card"><p class="alg-kicker">' + esc(q.v) + ' 御中</p><h1 class="alg-h1">貴館の予約一覧</h1>' +
      '<p class="alg-lead">これからの予約 ' + up.length + '件' + (up.filter(function (b) { return b.date === today; }).length ? '（今日 ' + up.filter(function (b) { return b.date === today; }).length + '件）' : '') + '。押すと、くわしい内容と入力の画面が開きます。</p>' +
      (up.length ? up.map(card).join('') : '<p class="alg-lead">これからの予約はありません。</p>') +
      (past.length ? '<button type="button" class="alg-btn inl-past" data-inl="past">' + (showPast ? '過去の予約を閉じる' : '過去の予約（' + past.length + '件）を見る') + '</button>' + (showPast ? past.reverse().map(card).join('') : '') : '') +
      '</section><p class="alg-small" style="text-align:center">お客様から変更・キャンセルの連絡があった場合は、観光協会（' + esc(DB.KYOKAI.phone) + '）へお知らせください。</p></main>';
    el.innerHTML = html;
    if (made) DB.save();
  }
  function sync() {
    var on = (window.__hp ? window.__hp() : location.pathname) === '/inn-list';
    var app = document.getElementById('root');
    if (on) {
      if (!el) { el = document.createElement('div'); el.id = 'oshino-inn'; el.className = 'inn-list'; document.body.appendChild(el); el.addEventListener('click', function (e) { if (e.target.closest('[data-inl="past"]')) { showPast = !showPast; render(); } }); }
      var sp = new URLSearchParams(window.__hs ? window.__hs() : ''); q = { v: sp.get('v'), k: sp.get('k') };
      visible = true; el.hidden = false; if (app) app.hidden = true; render(); window.scrollTo(0, 0); document.title = '貴館の予約一覧｜忍野村観光協会';
    } else if (visible) { visible = false; el.hidden = true; if (app && !document.querySelector('#oshino-inn:not([hidden]):not(.inn-list)')) app.hidden = false; }
  }
  DB.on(function () { if (visible) render(); });
  window.addEventListener('hashchange', sync); window.addEventListener('popstate', sync);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', sync); else sync();
})();
</script>
